const clone = value => JSON.parse(JSON.stringify(value));
const esc = value => String(value).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let state, history = [], timer = null, facilitator = false, physical = false;
function fresh(previous) {
 const orders={};
 for(const [id,d] of Object.entries(GAME_DATA.decisions)) {
  const a=[...d.options]; for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];} orders[id]=a;
 }
 if(previous && JSON.stringify(orders)===JSON.stringify(previous)) orders.J1.push(orders.J1.shift());
 return {screen:'title',days:8,Stalin:3,Churchill:3,done:[],opened:[],issue:null,decision:null,card:null,roll:null,log:[],orders,rows:0,toastReturn:null};
}
function save(){try{localStorage.setItem('yalta-1945-v1',JSON.stringify({state,history,physical}));}catch{}}
function valid(s){return s && ['title','briefing','select','decision','sealed','card','roll','stall','locked','exhausted','ending','history','debrief','toast','restart'].includes(s.screen) && Number.isInteger(s.days) && s.days>=0 && s.days<=8 && ['Stalin','Churchill'].every(k=>s[k]>=1&&s[k]<=5) && Array.isArray(s.log) && Array.isArray(s.done) && Array.isArray(s.opened) && Object.keys(GAME_DATA.decisions).every(k=>Array.isArray(s.orders?.[k]) && [...s.orders[k]].sort().join()===GAME_DATA.decisions[k].options.join());}
function boot(){state=fresh();try{const saved=JSON.parse(localStorage.getItem('yalta-1945-v1'));if(valid(saved?.state)&&Array.isArray(saved.history)&&saved.history.every(valid)){state=saved.state;history=saved.history;physical=!!saved.physical;}}catch{}render();}
function change(fn){clearTimeout(timer);timer=null;history.push(clone(state));fn();save();render();}
function undo(){if(!history.length)return;clearTimeout(timer);timer=null;state=history.pop();save();render();}
function log(text){state.log.push(text);}
function exhausted(){state.screen='exhausted';log('X3 — '+GAME_DATA.cards.X3.title);}
function pay(cost){if(state.days<cost){exhausted();return false;}state.days-=cost;return true;}
function applyCard(){const c=GAME_DATA.cards[state.card];for(const [who,n] of Object.entries(c.changes))state[who]=Math.max(1,Math.min(5,state[who]+n));if(c.main)state.done.push(state.decision);state.screen='card';log(state.card+' — '+(c.main?'Decision completed.':'Talks stalled; return to this decision.')+' Days left: '+state.days+'. Stalin: '+state.Stalin+'; Churchill: '+state.Churchill+'.');}
function openCard(){change(()=>{const c=GAME_DATA.cards[state.card];log('Opened telegram '+state.card+'.');if(!pay(c.cost))return;if(c.roll){state.roll={target:7-state.Stalin,value:null,success:null};state.screen='roll';}else applyCard();});}
function resolveRoll(value){if(state.screen!=='roll'||state.roll.value!==null)return;change(()=>{state.roll.value=value;state.roll.success=value>=state.roll.target;log('Roll: '+value+'; target '+state.roll.target+'+. '+(state.roll.success?'Success.':'Failed — X1: Stalin stalls; one extra day due.'));if(!state.roll.success){if(pay(1))state.screen='stall';}else applyCard();});}
function nextDecision(){if(state.done.length===8){state.screen='ending';return;}if(state.days===0){exhausted();return;}if(state.card && GAME_DATA.cards[state.card].main===false){state.screen='decision';state.card=null;state.roll=null;return;}const remaining=GAME_DATA.issues[state.issue]?.find(id=>!state.done.includes(id));if(remaining){state.decision=remaining;state.screen='decision';}else{state.decision=null;state.issue=null;state.screen='select';}state.card=null;state.roll=null;}
function selectIssue(issue){if(state.screen!=='select'||GAME_DATA.issues[issue].every(id=>state.done.includes(id)))return;change(()=>{if(issue==='UN'&&(state.Stalin===1||state.Churchill===1)){state.screen='locked';log('X2 — UN locked. No days spent.');return;}if(state.days===0){exhausted();return;}state.issue=issue;if(!state.opened.includes(issue))state.opened.push(issue);state.decision=GAME_DATA.issues[issue][0];state.screen='decision';log('Opened issue: '+issue+'.');});}
function choose(cid){if(state.screen!=='decision'||!state.orders[state.decision].includes(cid))return;change(()=>{state.card=cid;state.roll=null;state.screen='sealed';log('Choice: '+GAME_DATA.cards[cid].option);});}
function advance(){switch(state.screen){case'title':change(()=>state.screen='briefing');break;case'briefing':change(()=>state.screen='select');break;case'sealed':openCard();break;case'stall':change(applyCard);break;case'card':change(nextDecision);break;case'locked':change(()=>state.screen='select');break;case'exhausted':change(()=>state.screen='ending');break;case'ending':change(()=>{state.screen='history';state.rows=0;});break;case'history':change(()=>{if(state.rows<4)state.rows++;else state.screen='debrief';});break;}}
function startRoll(){if(timer||state.screen!=='roll')return;const el=document.getElementById('die');el.classList.add('rolling');document.getElementById('roll-button').disabled=true;el.textContent='…';timer=setTimeout(()=>{timer=null;resolveRoll(1+Math.floor(Math.random()*6));},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1000);}
function toast(who){if(state.screen!=='toast'||state.days<1||state[who]>=5)return;change(()=>{state.days--;state[who]++;log('Banquet toast to '+who+': −1 day, '+who+' +1.');state.screen=state.toastReturn;if(state.days===0)exhausted();});}
function act(action,value){if(action==='next')advance();else if(action==='issue')selectIssue(value);else if(action==='choose')choose(value);else if(action==='undo')undo();else if(action==='facilitator'){facilitator=!facilitator;render();}else if(action==='roll')startRoll();else if(action==='physical')resolveRoll(Number(value));else if(action==='toast'){if(['decision','select'].includes(state.screen)&&state.days>0)change(()=>{state.toastReturn=state.screen;state.screen='toast';});}else if(action==='toast-person')toast(value);else if(action==='cancel-toast')change(()=>state.screen=state.toastReturn);else if(action==='restart'){change(()=>{state.restartReturn=state.screen;state.screen='restart';});}else if(action==='cancel-restart')change(()=>state.screen=state.restartReturn);else if(action==='confirm-restart'){change(()=>{state=fresh(state.orders);});}else if(action==='print')window.print();}
const button=(text,action,value='',cls='')=>`<button class="${cls}" data-action="${action}" data-value="${esc(value)}">${text}</button>`;
const next=(text='Continue →')=>button(text,'next','','primary');
function paper(label,title,body,extra=''){return `<section class="paper ${extra}"><div class="eyebrow">${label}</div><h2>${esc(title)}</h2>${body}</section>`;}
function track(who){return `<div><h3>${who} · ${state[who]} / 5</h3><div class="scale" aria-label="${who}: ${state[who]}, ${GAME_DATA.labels.track[state[who]-1]}">${[1,2,3,4,5].map(n=>`<span aria-hidden="true">${n}</span>`).join('')}<span class="marker" style="--score:${state[who]-1}" aria-hidden="true">${state[who]}</span></div><div class="track-label">${GAME_DATA.labels.track[state[who]-1]}</div>${who==='Stalin'?`<p class="target">Stalin agrees on a roll of <strong>${7-state.Stalin}${state.Stalin===1?' only':'+'}</strong></p>`:''}</div>`;}
function renderHUD(){document.getElementById('hud').innerHTML=`<section class="hud" aria-label="Conference status"><div class="hud-grid"><div class="days"><h3>Days remaining · ${state.days} / 8</h3><div class="pips">${Array.from({length:8},(_,i)=>`<span class="pip ${i<8-state.days?'spent':''}" title="Day ${i+1}: ${i<8-state.days?'spent':'remaining'}" aria-label="Day ${i+1}: ${i<8-state.days?'spent':'remaining'}">${i+1}</span>`).join('')}</div></div>${track('Stalin')}${track('Churchill')}</div><div class="track-legend">1 Hostile · 2 Cool · 3 Wary · 4 Warm · 5 Close</div><div class="board" aria-label="Issue board">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>`<span>${esc(issue)} ${issue==='UN'&&(state.Stalin===1||state.Churchill===1)?'🔒 ':''}${ids.map((id,i)=>`<span role="checkbox" aria-checked="${state.done.includes(id)}" aria-label="${issue} decision ${i+1}">${state.done.includes(id)?'☑':'☐'}</span>`).join('')}</span>`).join('')}</div><div class="toolbar"><button data-action="toast" ${!['select','decision'].includes(state.screen)||state.days===0||(state.Stalin===5&&state.Churchill===5)?'disabled':''}>Banquet toast</button><button data-action="undo" ${history.length?'':'disabled'}>Undo</button><button data-action="facilitator" aria-pressed="${facilitator}">Facilitator mode ${facilitator?'on':'off'}</button>${button('Restart','restart')}<label><input type="checkbox" id="physical-toggle" ${physical?'checked':''} ${timer?'disabled':''}> Use physical die</label></div></section>`;}
function summary(){return `<div class="stats"><div><strong>${state.done.length} / 8</strong>decisions completed</div><div><strong>${state.days}</strong>days left</div><div><strong>${state.Stalin} / 5</strong>Stalin</div><div><strong>${state.Churchill} / 5</strong>Churchill</div></div><h3>Completed decisions</h3>${state.done.length?'<ul>'+state.done.map(id=>'<li>'+esc(id+' · '+GAME_DATA.decisions[id].title)+'</li>').join('')+'</ul>':'<p>None completed.</p>'}<h3>Unresolved issues</h3><ul>${Object.entries(GAME_DATA.issues).filter(([,ids])=>ids.some(id=>!state.done.includes(id))).map(([issue,ids])=>`<li>${issue} · ${ids.filter(id=>!state.done.includes(id)).join(', ')} unresolved</li>`).join('')||'<li>None.</li>'}</ul>`;}
function renderScreen(){const c=GAME_DATA.cards[state.card];switch(state.screen){case'title':return `<section class="hero"><div class="eyebrow">A negotiation game · One president. Eight days.</div><h1>Yalta 1945:<br>The Roosevelt Game</h1><p style="margin-top:28px">${esc(GAME_DATA.subtitle)}</p><div class="actions">${next('Begin →')}</div><p class="meta" style="font-size:14px;margin-top:28px">4–5 players · One shared Roosevelt · About 30 minutes</p></section>`;case'briefing':return paper('The presidential briefing','Eight days. Four issues.',`<p>${esc(GAME_DATA.briefing)}</p><h3>The rules</h3><ul class="rules">${GAME_DATA.rules.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul>${next('Take your seat →')}`);case'select':return `<div class="eyebrow">The conference table</div><h2>Which issue comes first?</h2><p>Choose an issue, then work through both of its decisions.</p><div class="cards">${Object.entries(GAME_DATA.issues).map(([issue,ids],i)=>{const complete=ids.every(id=>state.done.includes(id)),locked=issue==='UN'&&(state.Stalin===1||state.Churchill===1);return `<button class="issue" data-action="issue" data-value="${issue}" ${complete?'disabled':''}><small>0${i+1} / ${complete?'COMPLETE':locked?'🔒 LOCKED':'ON THE TABLE'}</small><strong>${issue}</strong><small>${ids.filter(id=>state.done.includes(id)).length} of 2 decisions completed</small></button>`;}).join('')}</div>`;case'decision':return `<div class="eyebrow">${state.issue} · Decision ${state.decision.slice(1)} of 2</div><h2>${esc(GAME_DATA.decisions[state.decision].title)}</h2><p>${esc(GAME_DATA.decisions[state.decision].question)}</p><div class="options">${state.orders[state.decision].map((id,i)=>button(`<span class="key">${i+1}</span><span>${esc(GAME_DATA.cards[id].option)}</span>`,'choose',id,'option')).join('')}</div>`;case'sealed':return `<div class="eyebrow">A reply has arrived</div><h2>From the conference table</h2><p>${esc(c.option)}</p><button class="envelope" data-action="next"><strong>CONFIDENTIAL · PRESIDENT'S COPY</strong><span class="seal" aria-hidden="true">FDR</span><strong>Open telegram →</strong></button>`;case'roll':return paper('Negotiation in progress','Will Stalin agree?',`<p>The decision costs ${c.cost} day. That cost has been paid.</p><p>Target before track changes: <strong>${state.roll.target}+</strong>. A failed roll costs one extra day.</p><div class="dice-row"><div class="die" id="die" aria-live="polite">?</div><div>${physical?'<p>Enter the physical die result:</p><div class="physical">'+[1,2,3,4,5,6].map(n=>button(n,'physical',n)).join('')+'</div>':'<button class="primary" id="roll-button" data-action="roll">Roll die →</button>'}</div></div>`);case'card':return paper('Telegram '+state.card,c.main?'An agreement is reached.':'The talks have stalled.',`<div class="telegram"><p>${esc(c.text)}</p></div>${state.roll?`<p class="result">Die: ${state.roll.value} · Target: ${state.roll.target}+ · ${state.roll.success?'Success':'Failed — X1 cost one extra day; Stalin then agreed'}</p>`:''}<div class="effects">${c.cost===0?'0 days spent':'−1 day'}${Object.entries(c.changes).map(([w,n])=>' · '+w+' '+(n>0?'+':'−')+Math.abs(n)).join('')}${!Object.keys(c.changes).length?' · No track changes':''}<br>${c.main?'Decision complete.':'Return to the same decision. Track damage remains.'}</div>${(GAME_DATA.reactions[state.card]||[]).map(r=>`<blockquote class="reaction"><strong>${r.who}</strong><p>“${esc(r.text)}”</p><small>${GAME_DATA.labels.drama}</small></blockquote>`).join('')}${next()}`);case'stall':return paper('Telegram X1',GAME_DATA.cards.X1.title,`<p>${esc(GAME_DATA.cards.X1.text)}</p><p class="result">Die: ${state.roll.value} · Target: ${state.roll.target}+ · Failed</p><div class="effects">−1 extra day paid. The agreement’s track changes apply next.</div>${next('Apply the agreement →')}`);case'locked':return paper('Telegram X2',GAME_DATA.cards.X2.title,`<p>${esc(GAME_DATA.cards.X2.text)}</p><div class="effects">No days spent. No track changes.</div>${next('Return to the table →')}`);case'exhausted':return paper('Telegram X3',GAME_DATA.cards.X3.title,`<p>${esc(GAME_DATA.cards.X3.text)}</p>${state.roll?.value?`<p>Die: ${state.roll.value} · Target: ${state.roll.target}+ · ${state.roll.success?'Success':'Failed — the extra day cannot be paid.'}</p>`:''}${next('View your outcome →')}`);case'toast':return paper('Between decisions','Raise a banquet toast',`<p>Spend one day to raise one relationship by one.</p><div class="actions">${['Stalin','Churchill'].map(w=>`<button data-action="toast-person" data-value="${w}" ${state[w]===5?'disabled':''}>${w} · ${state[w]} → ${Math.min(5,state[w]+1)}</button>`).join('')}${button('Cancel','cancel-toast')}</div>`);case'restart':return paper('A fresh conference','Start again?',`<p>A new game resets days, tracks and the decision log, and shuffles the options. Undo can restore this game.</p><div class="actions">${button('Start new game','confirm-restart','','primary')}${button('Keep playing','cancel-restart')}</div>`);case'ending':return paper('Your conference record','Leaving Yalta',`<p>${state.done.length===8?esc(GAME_DATA.complete):'Your conference has ended.'}</p>${summary()}${next('What happened in history →')}`);case'history':return paper('The historical record','Agreements and aftermath',`<p>${esc(GAME_DATA.historyIntro)}</p>${GAME_DATA.history.slice(0,state.rows).map(row=>`<article class="history-row"><h3>${row.issue}</h3><div><small>WHAT ROOSEVELT GOT AT YALTA</small><p>${esc(row.deal)}</p></div><div><small>WHAT HAPPENED NEXT</small><p>${esc(row.after)}</p></div><div class="group-result">Your group: ${GAME_DATA.issues[row.issue].every(id=>state.done.includes(id))?'main line reached':state.opened.includes(row.issue)?'not reached':'never opened'}</div></article>`).join('')}${state.rows===4?'<p style="margin-top:28px">'+esc(GAME_DATA.historyClosing)+'</p>':''}<div class="actions">${next(state.rows<4?'Reveal '+GAME_DATA.history[state.rows].issue+' →':'Begin the debrief →')}</div>`);case'debrief':return paper('Around the table','What did your choices cost?',`${Object.entries(GAME_DATA.debrief).map(([heading,questions])=>`<h3>${esc(heading)}</h3><ul>${questions.map(q=>'<li>'+esc(q)+'</li>').join('')}</ul>`).join('')}<div class="actions">${button('Print group summary','print','','primary')}${button('Play again','restart')}</div><section class="print-summary"><h2>Your group’s conference record</h2>${summary()}<h3>Choices, cards and rolls</h3><ol>${state.log.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol></section>`);}}
function renderFacilitator(){const panel=document.getElementById('facilitator');panel.hidden=!facilitator;panel.className='facilitator';document.getElementById('workspace').classList.toggle('facilitating',facilitator);if(!facilitator){panel.innerHTML='';return;}const key=state.decision||'Issue select';let entries=[];if(GAME_DATA.facilitator[key])entries.push(GAME_DATA.facilitator[key].split(' Also show this hint table:')[0]);if(state.card&&GAME_DATA.cards[state.card]?.main===false&&state.screen==='card')entries.push(GAME_DATA.facilitator['After any dead end']);if(state.roll?.success===false)entries.push(GAME_DATA.facilitator['After a failed roll']);if(state.days<=2)entries.push(GAME_DATA.facilitator['When 2 or fewer days remain']);panel.innerHTML='<h3>Facilitator notes</h3>'+entries.map(t=>'<p>'+esc(t)+'</p>').join('');if(key==='Issue select'){const hints=GAME_DATA.facilitator[key].split('Also show this hint table: ')[1];panel.innerHTML+='<table class="hint-table"><caption>Opening issue hints</caption><tbody>'+hints.split('; ').map(t=>{const [issue,detail]=t.split(' — ');return '<tr><th scope="row">'+esc(issue)+'</th><td>'+esc(detail)+'</td></tr>';}).join('')+'</tbody></table>';}}
function render(){renderHUD();document.getElementById('screen').innerHTML=renderScreen();renderFacilitator();document.getElementById('log-count').textContent=state.log.length;document.getElementById('log-list').innerHTML=state.log.map(t=>'<li>'+esc(t)+'</li>').join('');document.getElementById('screen').focus({preventScroll:true});window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.value);});
document.addEventListener('change',e=>{if(e.target.id==='physical-toggle'){clearTimeout(timer);timer=null;physical=e.target.checked;save();render();}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;const key=e.key.toLowerCase();if(key==='f'){e.preventDefault();act('facilitator');}else if(key==='u'){e.preventDefault();undo();}else if(['1','2','3'].includes(key)&&state.screen==='decision'){e.preventDefault();choose(state.orders[state.decision][Number(key)-1]);}else if((key==='enter'||key===' ')&&!['BUTTON','SUMMARY'].includes(tag)){e.preventDefault();advance();}});
boot();
</script></body></html>
