const nextButton=(text='Continue →')=>button(text,'next','','primary');
function paper(label,title,body){const seal=state.screen==='result'?`<span class="outcome-seal">${state.results[state.decision]?.status==='agreement'?'AGREED':'LEFT OPEN'}</span>`:'';return `<section class="paper">${seal}<div class="eyebrow">${label}</div><h2>${esc(title)}</h2>${body}</section>`;}
function avatar(who,score=3){
 const stroke='#172d31',skin='#f3c69a';
 const eyes='<g class="portrait-eyes"><ellipse cx="70" cy="89" rx="4" ry="6" fill="'+stroke+'"/><ellipse cx="110" cy="89" rx="4" ry="6" fill="'+stroke+'"/></g>';
 const body=who==='Churchill'?`<path d="M24 211L28 165Q31 143 63 139H117Q149 143 152 165L156 211" fill="#695884"/><path d="M60 143L90 177L120 143" fill="#fff1c8"/><path d="M47 145L66 186L80 164M133 145L114 186L100 164" fill="#8d78a7"/><path d="M88 160L67 151V175L89 168L112 175V151L92 160" fill="#d96c75"/><circle cx="90" cy="165" r="6" fill="#743a56"/><path d="M37 198L57 193M143 198L124 193" fill="none"/>`:who==='Stalin'?`<path d="M27 211L30 162Q35 142 63 139H117Q145 142 150 162L153 211" fill="#729b75"/><path d="M61 140L78 158H102L119 140" fill="#a8b77b"/><path d="M90 160V210" fill="none"/><path d="M33 155L58 146L61 158L33 166M147 155L122 146L119 158L147 166" fill="#f1cc6d"/><circle cx="99" cy="174" r="3" fill="#e8c978"/><circle cx="99" cy="192" r="3" fill="#e8c978"/><path d="M115 170H135V182H115Z" fill="#e5b377"/><path d="M118 170V182M126 170V182" stroke="#b85349"/><path d="M123 184L126 190L133 191L128 196L130 203L123 199L117 203L118 196L113 191L120 190Z" fill="#ffd26d" stroke-width="2"/>`:`<path d="M26 211L30 165Q34 141 64 139H116Q146 141 150 165L154 211" fill="${who==='Adviser'?'#dfaa63':'#629ead'}"/><path d="M64 142L90 176L116 142" fill="#fff3d5"/><path d="M48 149L65 187L81 164M132 149L115 187L99 164" fill="${who==='Adviser'?'#edc988':'#91c1cb'}"/><path d="M83 165H97L101 199L90 207L79 199Z" fill="#d25d6c"/><path d="M117 183H138" fill="none"/><path d="M121 181L125 173L130 181" fill="#fff3d5"/>`;
 let head='';
 if(who==='Churchill')head=`<path d="M43 75Q35 119 53 136Q66 148 90 148Q118 148 132 132Q146 110 135 75Z" fill="${skin}"/><ellipse cx="50" cy="103" rx="14" ry="16" fill="#f7d3ac"/><ellipse cx="130" cy="103" rx="14" ry="16" fill="#f7d3ac"/><path d="M62 79L77 82M103 82L119 79" fill="none" stroke-width="5"/>${eyes}<path d="M83 90L78 108Q90 116 103 108L98 90" fill="#eeb28a" stroke-width="2.5"/><path d="M69 122Q90 115 111 122M78 134Q90 138 102 134" fill="none" stroke-width="3"/><path d="M42 67L47 28Q91 9 132 28L138 67" fill="#26394b"/><path d="M47 51H133V69H47Z" fill="#53617b"/><path d="M26 68Q90 58 154 68L150 80Q89 72 30 80Z" fill="#26394b"/><path d="M57 31Q66 25 75 25" stroke="#74839a" fill="none" stroke-width="4"/>`;
 else if(who==='Stalin')head=`<path d="M45 60Q43 39 88 34Q133 34 136 62L132 117Q128 143 91 146Q53 142 48 118Z" fill="${skin}"/><path d="M43 69Q29 34 62 29Q74 10 94 26Q137 17 141 54L133 80L121 57Q93 65 66 52L53 78Z" fill="#31423c"/><path d="M54 39Q68 32 79 35" stroke="#647163" fill="none" stroke-width="4"/><path d="M58 79L78 84M102 84L123 79" fill="none" stroke-width="7"/>${eyes}<path d="M85 91L80 107Q91 113 102 107L96 91" fill="#e6a77c" stroke-width="2.5"/><path d="M89 109Q70 101 51 115L45 130Q63 137 88 123Q110 139 137 128L128 114Q110 102 94 109Z" fill="#31423c"/><path d="M78 134Q91 139 105 134" fill="none" stroke-width="3"/>`;
 else head=`<path d="M49 65Q48 35 90 35Q133 35 132 67L124 119Q116 145 90 148Q64 145 56 120Z" fill="${skin}"/><path d="M47 76Q38 49 50 34Q65 17 90 26Q130 20 137 52L129 78L119 52L100 44L75 50L57 48Z" fill="${who==='Adviser'?'#68514b':'#adb3a1'}"/><path d="M58 45Q65 34 80 36" stroke="${who==='Adviser'?'#a07c63':'#e1dec8'}" fill="none" stroke-width="4"/><path d="M59 76L76 77M104 77L122 76" fill="none" stroke-width="4"/>${eyes}<path d="M85 91L80 112L96 114" fill="none" stroke-width="2.5"/><path d="M73 126Q90 137 109 124" fill="none" stroke-width="3"/>${who==='Roosevelt'?'<g fill="none" stroke-width="3"><circle cx="68" cy="89" r="18"/><circle cx="112" cy="89" r="18"/><path d="M86 88H94M49 85L44 83M131 85L136 83"/></g>':''}`;
 return `<svg class="character character-${who.toLowerCase()}" viewBox="0 0 180 220" role="img" aria-label="${who==='Adviser'?'Your fictional adviser':who+' · stylised portrait'}"><ellipse cx="90" cy="209" rx="71" ry="8" fill="#0d2828" opacity=".25"/><g class="portrait-body" stroke="${stroke}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${body}</g><g class="portrait-head" stroke="${stroke}" stroke-width="4" stroke-linejoin="round" stroke-linecap="round">${head}</g></svg>`;
}
function issueArt(issue){const art={Japan:'<circle cx="40" cy="40" r="22"/><path d="M40 5V11M40 69V75M5 40H11M69 40H75M15 15L20 20M60 60L65 65M15 65L20 60M60 20L65 15"/><path d="M21 60Q40 51 59 60"/>',Poland:'<path d="M22 72V10M25 13H63V49H25Z"/><path d="M26 31H62V47H26Z" fill="currentColor" stroke="none"/><path d="M14 72H32"/>',UN:'<circle cx="40" cy="38" r="25"/><ellipse cx="40" cy="38" rx="12" ry="25"/><path d="M16 30H64M16 46H64M8 48Q7 66 29 72M72 48Q73 66 51 72"/>',Germany:'<path d="M12 67H68M20 66V29H60V66M14 29L40 10L66 29ZM29 36V57M40 36V57M51 36V57"/>'};return `<svg viewBox="0 0 80 80" fill="none" stroke="currentColor" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${art[issue]}</svg>`;}
function dossierGrid(interactive=true){return `<div class="dossiers">${Object.entries(ISSUE_VIEW).map(([issue,v],i)=>{const settled=state.closed.includes(issue),locked=issue==='UN'&&(state.Stalin===1||state.Churchill===1);return `<button class="dossier" style="--accent:${v.color};--tilt:${i%2?2:-2}deg" data-action="issue" data-value="${issue}" ${settled||!interactive?'disabled':''}><span class="card-corner" aria-hidden="true">${v.code}<i>✦</i></span><span class="stamp">${settled?'FILE CLOSED':locked?'LOCKED · RELATIONS':'ISSUE '+v.code}</span><span class="object-icon">${issueArt(issue)}</span><b>${issue==='UN'?'United Nations':issue}</b>${interactive?`<small>${settled?'Review at the ending':locked?'Both leaders need 2+':'Open discussion →'}</small>`:''}</button>`;}).join('')}</div>`;}
function conferenceStage(content,intro=false){
 const reactions=!intro&&state.screen==='reaction'?GAME_DATA.cards[state.card].firstReactions:[];
 const adviser=reactions.find(r=>r.who==='Adviser');
 const speaker=(who)=>{const r=reactions.find(x=>x.who===who);return `<div class="seat seat-${who.toLowerCase()} ${r?'first-reaction is-speaking':''}"><div class="seat-portrait leader"><div class="chair-back" aria-hidden="true"></div>${avatar(who)}<div class="seat-name">${who}<span>${intro?'AT THE TABLE':state[who]+' / 5 · '+GAME_DATA.labels.track[state[who]-1]}</span></div></div>${r?`<div class="table-speech"><p>“${esc(r.text)}”</p><small>Dramatised line, not a historical quote.</small></div>`:''}</div>`;};
 return `<section class="conference-stage ${intro?'stage-intro':''} ${reactions.length?'stage-speaking':''}" aria-label="The conference room"><div class="room-architecture" aria-hidden="true"><div class="back-wall"></div><div class="room-window"></div><div class="wall-light left"></div><div class="wall-light right"></div><div class="overhead-lamp"></div><div class="light-cone"></div><div class="room-plaque">LIVADIA · 1945</div></div><div class="seats ${reactions.length?'first-reactions':''}">${speaker('Churchill')}${speaker('Stalin')}</div>${adviser?`<div class="adviser-aside first-reaction"><div class="adviser-mini">${avatar('Adviser')}<b>Your adviser</b></div><div class="table-speech"><p>“${esc(adviser.text)}”</p><small>Fictional adviser. Dramatised line, not a historical quote.</small></div></div>`:''}<div class="table-rim"><div class="table-surface"><div class="felt-mark" aria-hidden="true">Y<span>✦</span>45</div><div class="desk-content">${content}</div></div></div><div class="your-seat" aria-label="You are Roosevelt"><span class="cuff cuff-left" aria-hidden="true"></span><span class="seat-ticket">YOUR SEAT <b>ROOSEVELT</b></span><span class="cuff cuff-right" aria-hidden="true"></span></div></section>`;
}
function room(interactive=true){return conferenceStage(`<div class="table-caption">FOUR ISSUES. ONE SHARED ROOSEVELT.</div>${dossierGrid(interactive)}`,!interactive);}
function hud(){const show=!['title','briefing'].includes(state.screen);document.getElementById('hud').hidden=!show;if(!show)return;document.getElementById('hud').innerHTML=`<section class="hud" aria-label="Conference status"><div class="hud-top"><div class="day-group"><span class="hud-label">Time at the table</span><strong>${state.days} days remaining</strong><div class="days">${Array.from({length:8},(_,i)=>`<span class="day ${i<8-state.days?'spent':''}" aria-label="Day ${i+1}: ${i<8-state.days?'spent':'available'}">${i+1}</span>`).join('')}</div></div>${['Stalin','Churchill'].map(w=>`<div><span class="hud-label">${w}</span><strong>${state[w]} / 5 · ${GAME_DATA.labels.track[state[w]-1]}</strong><div class="track" aria-hidden="true">${[1,2,3,4,5].map(n=>`<span class="${n<=state[w]?'on':''}"></span>`).join('')}</div><span class="tiny">${w==='Stalin'?'Roll '+(7-state[w])+'+ for agreement':'UN needs both leaders at 2+'}</span></div>`).join('')}</div><div class="hud-bottom"><div class="board">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>`<span>${issue} ${ids.map(id=>`<span aria-label="${id}: ${state.results[id]?.status||'unresolved'}">${state.results[id]?.status==='agreement'?'●':state.results[id]?'×':'○'}</span>`).join('')}</span>`).join('')}</div><div class="toolbar"><button data-action="toast" ${!['select','decision'].includes(state.screen)||!state.days||(state.Stalin===5&&state.Churchill===5)?'disabled':''}>Toast · 1 day</button><button data-action="undo" ${history.length?'':'disabled'}>Undo</button><button data-action="notes" aria-pressed="${facilitator}">Facilitator ${facilitator?'on':'off'}</button>${button('Restart','restart')}<label><input type="checkbox" id="physical-toggle" ${physical?'checked':''} ${timer?'disabled':''}> Physical die</label></div></div></section>`;}
function scoreSummary(){const values=Object.values(state.results),total=values.reduce((n,r)=>n+r.score,0),agreements=values.filter(r=>r.status==='agreement').length;return `<div class="score-grid"><div class="score-box"><strong>${total>0?'+':''}${total}</strong><span>DECISION POINTS</span></div><div class="score-box"><strong>${agreements}/8</strong><span>AGREEMENTS</span></div><div class="score-box"><strong>${8-agreements}</strong><span>UNRESOLVED DECISIONS</span></div><div class="score-box"><strong>${state.days}</strong><span>DAYS LEFT</span></div></div><p class="tiny">Stalin ${state.Stalin}/5 · Churchill ${state.Churchill}/5. Scores are teaching judgments, not historical grades. Read the explanations alongside the total. Unattempted decisions add no points.</p>`;}
function outcomes(){return Object.entries(GAME_DATA.decisions).map(([id,d])=>{const r=state.results[id];return `<article class="outcome"><h3><span>${id} · ${esc(d.title)}</span>${r?`<span class="score ${r.score<0?'negative':''}">${r.score>0?'+':''}${r.score}</span>`:''}</h3>${r?`<p><b>${r.status==='agreement'?'Agreement':'Unresolved · deliberate walkaway'}:</b> ${esc(r.title)}</p><p><b>Your proposal:</b> ${esc(r.proposal)}</p><p>${esc(r.text)}</p><p><b>Why this score:</b> ${esc(r.why)}</p>`:'<p>Unresolved · no settled decision. No points added.</p>'}</article>`;}).join('');}

function proposalPanel(cid){const c=GAME_DATA.cards[cid];return `<section id="reflection-${cid}" class="proposal-send" aria-label="Send selected proposal"><p>Send this proposal to hear the room’s first reactions. You can reconsider afterwards.</p><span class="tiny">Standing by it afterwards costs ${c.cost} ${c.cost===1?'day':'days'}. Nothing spent yet.</span><div class="actions">${button('Send proposal →','send','','primary')}</div></section>`;}
function reactionScreen(){const c=GAME_DATA.cards[state.card];return paper('First reactions · Dramatised simulation','Read the room.',`<div class="proposal sent-proposal"><span class="proposal-label">ON THE TABLE</span>${esc(c.option)}</div><p class="reaction-invite">What do you make of those responses? Stand by your position or reconsider.</p><p class="tiny reaction-explainer">Initial impressions, not an agreement or a final refusal. No days or relationships have changed. Standing by it commits ${c.cost} ${c.cost===1?'day':'days'}.</p><div class="actions">${button('Stand by this proposal →','commit','','primary')}${button('Reconsider','reconsider','','quiet')}</div>`);}
function decisionScreen(){const d=GAME_DATA.decisions[state.decision];return paper(state.issue+' · Decision '+state.decision.slice(1)+' of 2',d.title,`<p>${esc(d.question)}</p><p class="tiny">Choose a proposal, send it, then hear the room before you commit.</p><div class="options">${state.orders[state.decision].map((id,i)=>{const open=state.screen==='reflect'&&state.card===id;return `<div class="proposal-choice ${open?'expanded':''}"><button class="option" data-action="choose" data-value="${id}" aria-expanded="${open}" aria-controls="reflection-${id}"><span class="key">${i+1}</span><span>${esc(GAME_DATA.cards[id].option)}</span><span class="arrow" aria-hidden="true">${open?'−':'+'}</span></button>${open?proposalPanel(id):`<div id="reflection-${id}" hidden></div>`}</div>`;}).join('')}</div>${state.screen==='decision'?`<div class="actions">${button('Leave this issue unresolved','leave','','quiet')}</div>`:''}`);}

function screen(){const c=GAME_DATA.cards[state.card],d=GAME_DATA.decisions[state.decision],b=GAME_DATA.branches[state.decision];switch(state.screen){
case'title':return `<section class="hero"><div><span class="pill">A DISCUSSION GAME · ABOUT 30 MINUTES</span><h1>Big decisions.<br><em>Eight days.</em></h1><div class="title-tickets" aria-hidden="true"><span>01 PRESIDENT</span><span>04 ISSUES</span><span>08 DAYS</span></div><p class="lead">You’re Roosevelt. Your group calls the shots. What will you give up to get an agreement?</p><p class="tiny">${esc(GAME_DATA.subtitle)}</p><div class="actions">${nextButton('Take your seat →')}</div>${storageNotice?'<p class="notice" style="margin-top:20px;color:var(--ink)">'+esc(storageNotice)+'</p>':''}</div>${room(false)}</section>`;
case'briefing':return paper('Before the meeting','One president. Your choices.',`<p>${esc(GAME_DATA.briefing)}</p><ul class="rules">${GAME_DATA.rules.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul><h3>What the hidden scores mean</h3><p class="tiny">Each settled decision earns −1, 0, +1 or +2. The assessment considers your goals, leverage, safeguards and concessions. Relationships are separate; pleasing a leader does not automatically earn points.</p><details><summary>Read the scoring rubric</summary><ul>${Object.entries(GAME_DATA.rubric).map(([n,t])=>'<li><b>'+n+'</b> · '+t+'</li>').join('')}</ul></details><p class="notice">${GAME_DATA.simulationNotice} The historical record is shown separately after play.</p><div class="actions">${nextButton('Open the conference →')}</div>`);
case'select':return `<div class="table-heading"><div><div class="eyebrow">The conference table</div><h2>${state.opened.length?'What comes next?':'Where do you begin?'}</h2></div><span class="table-caption">PICK YOUR NEXT ISSUE</span></div>${dossierGrid()}<div class="table-after"><p class="table-prompt">Which issue matters most—and whose cooperation will you need?</p>${button('Close conference early','leave','','quiet')}</div>`;
case'decision':case'reflect':return decisionScreen();
case'reaction':return reactionScreen();
case'roll':return paper('Stalin is considering your proposal','Will he agree?',`<div class="question-header"><div class="mini-avatar">${avatar('Stalin',state.Stalin)}</div><p>The proposal’s day has been paid. You need <b>${state.roll.target}+</b>, based on Stalin’s current relationship. Track changes come after the result.</p></div><p class="notice">A failed roll creates a counteroffer. You choose whether to spend time, accept modified terms or walk away.</p><div class="die-row"><div id="die" class="die" role="status" aria-live="polite">?</div>${physical?'<div class="physical">'+[1,2,3,4,5,6].map(n=>button(n,'physical',n)).join('')+'</div>':'<button id="roll-button" class="primary" data-action="roll">Roll die →</button>'}</div>`);
case'counter':{const cost=bargainCost();return paper('Simulation · '+(state.reason==='roll'?'A complication':'A counteroffer'),'The terms have changed.',`<div class="question-header"><div class="mini-avatar">${avatar(b.who,state[b.who])}</div><div><h3>${b.who}</h3><p class="tiny">Dramatised line, not a historical quote.</p></div></div><div class="bubble"><p>${esc(b.text)}</p></div>${state.roll?`<p class="notice">Roll ${state.roll.value} · Target ${state.roll.target}+. No extra day has been charged. The original proposal’s day is already spent.</p>`:`<p class="notice">Your proposal has been heard. ${effectsText(c.changes)}. Its day is already spent.</p>`}<div class="counter-options">${button((state.reason==='roll'?'Accept conditional support':esc(b.label))+'<small>No extra day. '+(state.reason==='roll'?'Leave remaining detail open.':esc(b.title))+'. '+effectsText(b.changes)+'.</small>','counter','accept','primary')}<button data-action="counter" data-value="press" ${state.days<cost?'disabled':''}>${esc(b.press)}<small>${cost?'Spend 1 extra day.':'No extra day: '+b.who+' is warm enough to continue readily.'} ${esc(b.pressText)} ${effectsText(b.changes)}.</small></button>${button('Walk away from this issue<small>No extra day or relationship change. Remaining decisions on this issue stay unresolved.</small>','counter','walk','quiet')}</div>`);}
case'result':{const r=state.results[state.decision];return paper(r.historical?'Historical agreement · '+state.card:'Simulation outcome · '+state.decision,r.title,`<p>${esc(r.text)}</p><div class="effect"><span>${state.days} days remaining</span><span>${effectsText(r.changes||{})}</span><span>${r.status==='agreement'?'Agreement recorded':'Issue left unresolved'}</span></div>${r.historical?(GAME_DATA.reactions[state.card]||[]).map(x=>`<div class="bubble"><b>${x.who}</b><p>${esc(x.text)}</p><small class="tiny">${GAME_DATA.labels.drama}</small></div>`).join(''):'<p class="notice" style="margin-top:20px">'+GAME_DATA.simulationNotice+'</p>'}<p class="tiny" style="margin-top:20px">Your decision is recorded. Its score and explanation will be revealed at the ending.</p><div class="actions">${nextButton()}</div>`);}
case'locked':return paper('UN · Relationships need repair','The room is too divided.',`<p>${esc(GAME_DATA.cards.X2.text)}</p><p class="notice">Stalin ${state.Stalin}/5 · Churchill ${state.Churchill}/5. Both need at least 2. No days spent.</p><div class="actions">${nextButton('Return to the table →')}</div>`);
case'toast':return paper('Make room for cooperation','Raise a toast.',`<p>One day raises one relationship by one. It does not settle a decision.</p>${state.days===1?'<p class="notice">This spends your last day. Your conference will end immediately.</p>':''}<div class="actions">${['Stalin','Churchill'].map(w=>`<button data-action="toast-person" data-value="${w}" ${state[w]===5?'disabled':''}>${w}: ${state[w]} → ${Math.min(5,state[w]+1)}</button>`).join('')}${button('Cancel','cancel','','quiet')}</div>`);
case'leave':return paper('A deliberate choice',state.returnTo==='select'?'Close the conference?':'Leave this issue unresolved?',`<p>${state.returnTo==='select'?'Your ending will reveal the decisions made so far. Unattempted decisions remain unresolved.':'You will move on to other priorities. This decision records a walkaway, and any remaining decision on this issue stays unattempted. You cannot reopen a closed issue.'}</p><p class="notice">No day or relationship cost.</p><div class="actions">${button('Confirm →','confirm-leave','','primary')}${button('Keep negotiating','cancel','','quiet')}</div>`);
case'restart':return paper('Fresh start','Start a new conference?',`<p>Reset this redesign’s progress and reshuffle the proposals. Your original-version save stays separate. Undo can restore this conference.</p><div class="actions">${button('Start new game','confirm-restart','','primary')}${button('Keep playing','cancel','','quiet')}</div>`);
case'exhausted':return paper('Time is up','Roosevelt leaves Yalta.',`<p>${esc(GAME_DATA.cards.X3.text)}</p><div class="actions">${nextButton('Reveal your outcome →')}</div>`);
case'ending':return paper('The full picture','What did your choices cost?',`${scoreSummary()}<p>${Object.values(state.results).filter(r=>r.status==='agreement').length===8?'You reached an agreement on every decision. Read the trade-offs before judging your result.':'Your conference contains unresolved decisions. Review what you secured and what you left open.'}</p>${outcomes()}<div class="actions">${nextButton('Compare with history →')}${button('Print this record','print','','quiet')}</div>`);
case'history':return paper('Historical record · not the simulated branches','What happened after Yalta?',`<p>${esc(GAME_DATA.historyIntro)}</p><p class="tiny">${state.rows} of 4 issues revealed</p>${GAME_DATA.history.slice(0,state.rows).map(r=>`<article class="history-row"><h3>${r.issue}</h3><div class="history-columns"><div><small>WHAT ROOSEVELT GOT</small><p>${esc(r.deal)}</p></div><div><small>WHAT HAPPENED NEXT</small><p>${esc(r.after)}</p></div></div><p class="notice">Your group: ${GAME_DATA.issues[r.issue].filter(id=>state.results[id]?.status==='agreement').length}/2 agreements · ${state.opened.includes(r.issue)?'issue opened':'never opened'}. Simulated agreements may differ from the historical settlement.</p></article>`).join('')}${state.rows===4?'<p style="margin-top:24px">'+esc(GAME_DATA.historyClosing)+'</p>':''}<div class="actions">${nextButton(state.rows<4?'Reveal '+GAME_DATA.history[state.rows].issue+' →':'Discuss your conference →')}</div>`);
case'debrief':return paper('Back to your group','Defend your decisions.',`<p>Which score would you challenge? Use your goals and the situation to explain why. The rubric starts a discussion; it does not settle it.</p>${Object.entries(GAME_DATA.debrief).map(([h,qs])=>'<h3>'+esc(h)+'</h3><ul>'+qs.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>').join('')}<div class="actions">${button('Print group summary','print','','primary')}${button('Play again','restart','','quiet')}</div><section class="print-only"><h2>Your conference record</h2>${scoreSummary()}${outcomes()}<h3>Choice and roll log</h3><ol>${state.log.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol></section>`);
}}
function render(){document.body.dataset.screen=state.screen;document.querySelector('.app').classList.toggle('has-hud',!['title','briefing'].includes(state.screen));hud();const content=screen();const atTable=['select','decision','reflect','reaction','roll','counter','result','locked','toast','leave','exhausted'].includes(state.screen);document.getElementById('screen').innerHTML=atTable?conferenceStage(content):content;const notes=document.getElementById('notes');notes.hidden=!facilitator;document.getElementById('layout').classList.toggle('notes-on',facilitator);if(facilitator){const key=state.decision||'Issue select';notes.innerHTML='<h3>Facilitator notes</h3><p class="tiny">Visible to everyone looking at this screen. F hides notes.</p><p>'+esc(GAME_DATA.facilitator[key]||'Discuss your priorities and compare the group’s reasoning with its outcomes.')+'</p><p>Do not reveal point values during play. Invite a reason for each proposal and discuss who bears its costs.</p>'+(state.screen==='reaction'?'<p><b>Optional discussion prompts</b></p>'+GAME_DATA.cards[state.card].questions.map(q=>'<p>'+esc(q)+'</p>').join(''):'')+(state.days<=2?'<p>What are you leaving unresolved, and who will pay for it later?</p>':'');}else notes.innerHTML='';document.getElementById('log').hidden=!state.log.length;document.getElementById('log-count').textContent=state.log.length;document.getElementById('log-list').innerHTML=state.log.map(t=>'<li>'+esc(t)+'</li>').join('');document.getElementById('screen').focus({preventScroll:true});if(state.screen==='reflect'){const selected=document.querySelector('.proposal-choice.expanded');selected.scrollIntoView({block:'nearest',behavior:'instant'});}else if(state.screen!=='decision'){window.scrollTo(0,0);}}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.value);});
document.addEventListener('change',e=>{if(e.target.id==='physical-toggle'){cancelRoll();physical=e.target.checked;save();render();}});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(k==='escape'&&state.screen==='reaction'){e.preventDefault();reconsider();}else if(k==='u'){e.preventDefault();undo();}else if(k==='f'){e.preventDefault();act('notes');}else if(['1','2','3'].includes(k)&&['decision','reflect'].includes(state.screen)){e.preventDefault();choose(state.orders[state.decision][Number(k)-1]);}else if((k==='enter'||k===' ')&&!['BUTTON','SUMMARY'].includes(e.target.tagName)){e.preventDefault();next();}});
boot();
</script></body></html>
