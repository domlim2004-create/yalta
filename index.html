/* Transient visual layers never enter the saved game state. */
.motion-layer{position:fixed;inset:0;z-index:30;overflow:hidden;pointer-events:auto;perspective:1200px}
.motion-ghost{position:absolute!important;margin:0!important;pointer-events:none!important;transform-origin:center;will-change:transform,opacity;box-shadow:0 18px 40px #0004}
.motion-page{box-shadow:none!important}
.motion-ghost.issue:hover,.motion-ghost.option:hover{transform:none}
.envelope{perspective:1100px;isolation:isolate;overflow:visible;transform-style:flat}
.envelope:before{display:none}
.envelope-letter,.envelope-pocket,.envelope-flap{position:absolute;display:block;pointer-events:none}
.envelope-letter{inset:18px 20px 20px;background:#faf5e6;border:1px solid #c7ba99;padding:25px 20px;font:12px/2 var(--mono);letter-spacing:.12em;text-align:left;color:#6d715d;z-index:1;box-shadow:0 3px 10px #0001}
.envelope-letter:after{content:'';display:block;margin-top:18px;height:50px;background:repeating-linear-gradient(transparent 0 13px,#c8c1aa 13px 14px)}
.envelope-pocket{inset:0;background:#e5dbbd;clip-path:polygon(0 0,50% 55%,100% 0,100% 100%,0 100%);z-index:3}
.envelope-pocket:after{content:'';position:absolute;inset:0;background:linear-gradient(25deg,transparent 49.7%,#b6a782 50%,transparent 50.3%),linear-gradient(-25deg,transparent 49.7%,#b6a782 50%,transparent 50.3%);opacity:.6}
.envelope-flap{left:0;right:0;top:0;height:56%;background:#d6c9a6;clip-path:polygon(0 0,100% 0,50% 100%);transform-origin:50% 0;backface-visibility:visible;z-index:4}
.envelope>strong,.envelope>.seal{z-index:5;position:relative}.envelope .open-label{z-index:5}
.motion-layer .envelope{overflow:visible}
.sweeping-hand{position:absolute;left:0;z-index:3;pointer-events:none;filter:drop-shadow(4px 16px 10px #0005);will-change:transform,opacity;transform-origin:7% 86%}
.sweeping-hand svg{width:100%;height:auto;overflow:visible}
.forearm-grip{transform-box:fill-box;transform-origin:0% 65%}
.motion-ghost.chosen-dossier{z-index:4;box-shadow:0 30px 65px #0007;border-color:#c5a66e}

@media print{.motion-layer{display:none!important}}

@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}

 current.layer.remove();

}

// One arm performs three distinct gestures: fan, clear the near file, then pick up.
function animateDossierSequence(ghosts,bounds,layer,animate){
 layer.style.clipPath=`inset(${Math.max(0,bounds.top-10)}px 0 0)`;
 const chosen=ghosts.find(g=>g.selected),r=chosen.rect;
 const cx=r.left+r.width/2,cy=r.top+r.height/2;
 const direction=cx<bounds.left+bounds.width/2?1:-1;
 let side=ghosts.filter(g=>!g.selected&&Math.abs(g.rect.left+g.rect.width/2-cx)>r.width*.55);
 let near=ghosts.filter(g=>!g.selected&&!side.includes(g));
 // A narrow screen has one column: reserve the closest file for the second sweep.
 if(!side.length&&near.length>1){near.sort((a,b)=>Math.abs(a.rect.top-r.top)-Math.abs(b.rect.top-r.top));side=near.slice(1);near=near.slice(0,1);}
 const vertical=near.length&&near[0].rect.top<r.top?-1:1;
 const total=3200;
 for(const g of side){
  g.node.dataset.sweepStage='1';
  animate(g.node,[{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${direction*innerWidth*.22}px,12px) rotate(${direction*6}deg)`,opacity:1,offset:.45},{transform:`translate(${direction*(innerWidth+g.rect.width)}px,36px) rotate(${direction*18}deg)`,opacity:0}],{delay:430+(g.rect.top-Math.min(...side.map(t=>t.rect.top)))*.18,duration:540,easing:'cubic-bezier(.42,0,.58,1)'});
 }
 for(const g of near){
  g.node.dataset.sweepStage='2';
  animate(g.node,[{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${direction*16}px,${vertical*innerHeight*.2}px) rotate(${-direction*5}deg)`,opacity:1,offset:.4},{transform:`translate(${direction*35}px,${vertical*(innerHeight+g.rect.height)}px) rotate(${-direction*12}deg)`,opacity:0}],{delay:1450,duration:590,easing:'cubic-bezier(.42,0,.58,1)'});
 }
 chosen.node.classList.add('chosen-dossier');chosen.node.dataset.sweepStage='3';
 const dx=bounds.left+bounds.width/2-cx,dy=bounds.top+65-r.top;
 const carry=`translate(${dx}px,${dy}px) rotate(-2deg) scale(1.07)`;
 animate(chosen.node,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:'translate(0,0) scale(1)',opacity:1,offset:.75},{transform:'translate(0,-6px) rotate(-1deg) scale(1.02)',opacity:1,offset:.81},{transform:carry,opacity:1,offset:.92},{transform:`translate(${dx}px,${dy-12}px) scale(1.15)`,opacity:0}],{duration:total,easing:'linear'});
 const arm=sweepingForearm(),width=Math.min(860,Math.max(610,innerHeight*1.05));
 const unit=width/900,ox=70*unit,oy=350*unit;
 Object.assign(arm.style,{width:width+'px',top:'0px',transformOrigin:`${ox}px ${oy}px`,zIndex:'5'});layer.appendChild(arm);
 const pose=(x,y,angle,scale=1)=>`translate(${x-ox}px,${y-oy}px) rotate(${direction*angle}deg) scale(${direction*scale},${scale})`;
 const offset=(angle,scale=1)=>{const a=direction*angle*Math.PI/180,x=direction*705*unit*scale,y=-138*unit*scale;return {x:x*Math.cos(a)-y*Math.sin(a),y:x*Math.sin(a)+y*Math.cos(a)};};
 // The elbow pivots and travels with the push, avoiding a fixed-hinge finish.
 const ex=bounds.left+bounds.width*(direction===1?.57:.43),ey=Math.min(innerHeight+50,bounds.bottom+100);
 const target=near[0]?.rect||r;
 const secondAngle=vertical===1?-143:-190;
 const secondOffset=offset(secondAngle,.95);
 const handX=target.left+target.width*(direction===1?.25:.75),handY=vertical===1?target.top+target.height*.18:target.bottom-target.height*.18;
 const sx=handX-secondOffset.x,sy=handY-secondOffset.y;
 const sideTravel=Math.min(360,Math.max(180,bounds.width*.25));
 const verticalTravel=Math.min(340,Math.max(180,target.height*1.35));
 const gripAngle=-116,gripOffset=offset(gripAngle,.92);
 const gx=(direction===1?r.right-45:r.left+45)-gripOffset.x,gy=r.bottom-20-gripOffset.y;
 animate(arm,[
  {transform:pose(ex,ey+110,-77),opacity:0},
  {transform:pose(ex,ey,-74),opacity:1,offset:.06},
  {transform:pose(ex+direction*8,ey-5,-67),opacity:1,offset:.13},
  {transform:pose(ex+direction*sideTravel,ey-12,-8),opacity:1,offset:.30},
  {transform:pose(ex+direction*sideTravel*.15,ey,-64),opacity:1,offset:.37},
  {transform:pose(sx,sy,secondAngle,.95),opacity:1,offset:.44},
  {transform:pose(sx+direction*22,sy+vertical*verticalTravel,secondAngle-vertical*23,.95),opacity:1,offset:.63},
  {transform:pose(sx+direction*8,sy+vertical*verticalTravel*.22,secondAngle-vertical*3,.95),opacity:1,offset:.68},
  {transform:pose(gx,gy,gripAngle,.92),opacity:1,offset:.75},
  {transform:pose(gx,gy-6,gripAngle-2,.92),opacity:1,offset:.81},
  {transform:pose(gx+dx,gy+dy,gripAngle-2,.95),opacity:1,offset:.92},
  {transform:pose(gx+dx,gy+dy+85,gripAngle+4,.95),opacity:0}
 ].map(frame=>({...frame,easing:'cubic-bezier(.42,0,.58,1)'})),{duration:total,easing:'linear'});
 const grip=arm.querySelector('.forearm-grip');
 animate(grip,[{transform:'scale(1,1)'},{transform:'scale(.84,.94) rotate(5deg)'}],{delay:2320,duration:230});
}
// Short sheet transitions for navigation; the dossier and envelope keep their own gestures.
function transitionPage(commit,arrival=false){
 if(matchMedia('(prefers-reduced-motion: reduce)').matches||!Element.prototype.animate){commit();return;}
 const scene=document.getElementById('screen'),before=state.screen;
 const rect=scene.getBoundingClientRect(),outgoing=arrival?null:scene.cloneNode(true);
 commit();
 const layer=document.createElement('div');layer.className='motion-layer';layer.setAttribute('aria-hidden','true');
 const current={layer,animations:[]};motion=current;document.body.appendChild(layer);scene.setAttribute('aria-busy','true');
 const animate=(element,frames,options={})=>{if(!element)return;const animation=element.animate(frames,{fill:'both',duration:380,easing:'cubic-bezier(.22,.7,.25,1)',...options});current.animations.push(animation);};
 const revealing=before==='history'&&state.screen==='history'&&!arrival;
 if(outgoing&&!revealing){
  outgoing.removeAttribute('id');outgoing.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));outgoing.inert=true;outgoing.classList.add('motion-ghost','motion-page');
  Object.assign(outgoing.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'});layer.appendChild(outgoing);
  animate(outgoing,[{opacity:1,transform:'translate(0,0) rotate(0)'},{opacity:0,transform:'translate(-65px,8px) rotate(-1deg)'}],{duration:260});
 }
 if(revealing){
  animate(scene.querySelector('.history-row:last-of-type'),[{opacity:0,transform:'translateY(18px)'},{opacity:1,transform:'translateY(0)'}]);
  animate(scene.querySelector('.actions'),[{opacity:0},{opacity:1}],{duration:260});
 }else{
  const wait=arrival?0:100,slide=arrival?0:Math.min(28,Math.max(0,innerWidth-scene.getBoundingClientRect().right-4));
  animate(scene,[{opacity:0,transform:`translate(${slide}px,${arrival?18:6}px)`},{opacity:1,transform:'translate(0,0)'}],{delay:wait,duration:arrival?500:380});
  const targets=state.screen==='select'?scene.querySelectorAll('.issue'):state.screen==='briefing'?scene.querySelectorAll('.brief-rules li'):state.screen==='decision'?scene.querySelectorAll('.option'):scene.querySelectorAll('.debrief-label');
  [...targets].forEach((element,i)=>animate(element,[{opacity:0,transform:'translateY(15px)'},{opacity:1,transform:'translateY(0)'}],{delay:wait+65+i*45,duration:300}));
 }
 Promise.allSettled(current.animations.map(animation=>animation.finished)).then(()=>{if(motion===current)cancelMotion();});
}
function transitionTo(kind,selected,commit){
 if(!selected||matchMedia('(prefers-reduced-motion: reduce)').matches||!selected.animate){commit();return;}
 const source=kind==='folder'?'.issue':kind==='proposal'?'.option':'.envelope';
 const scene=document.getElementById('screen');
 const bounds=scene.getBoundingClientRect();
 const ghosts=[...scene.querySelectorAll(source)].map(element=>({
  selected:element===selected,rect:element.getBoundingClientRect(),node:element.cloneNode(true)
 }));
 // Commit once immediately. Refresh/Undo see the same action as unanimated play.
 commit();
 const layer=document.createElement('div');layer.className='motion-layer';layer.setAttribute('aria-hidden','true');
 const current={layer,animations:[]};motion=current;document.body.appendChild(layer);scene.setAttribute('aria-busy','true');
 const animate=(element,frames,options)=>{
  const animation=element.animate(frames,{fill:'both',easing:'cubic-bezier(.22,.7,.25,1)',...options});
  current.animations.push(animation);return animation;
 };
 for(const ghost of ghosts){
  const {node,rect}=ghost;node.classList.add('motion-ghost');node.inert=true;node.removeAttribute('id');
  node.querySelectorAll('[id]').forEach(el=>el.removeAttribute('id'));
  Object.assign(node.style,{left:rect.left+'px',top:rect.top+'px',width:rect.width+'px',height:rect.height+'px'});
  layer.appendChild(node);
  if(kind==='folder')continue;
  if(kind==='envelope'){
   animate(node.querySelector('.envelope-flap'),[{transform:'rotateX(0deg)'},{transform:'rotateX(-175deg)'}],{duration:700});
   animate(node.querySelector('.seal'),[{transform:'scale(1)',opacity:1},{transform:'translate(24px,22px) rotate(22deg) scale(.75)',opacity:0}],{duration:350});
   node.querySelectorAll('strong').forEach(el=>animate(el,[{opacity:1},{opacity:0}],{duration:260}));
   // Lift the paper above both the pocket and flap as extraction begins.
   animate(node.querySelector('.envelope-letter'),[{zIndex:1,transform:'translateY(0) scale(1)',opacity:1},{zIndex:6,transform:'translateY(-12px) scale(1)',opacity:1,offset:.06},{zIndex:6,transform:'translateY(-140px) scale(1.025)',opacity:1}],{delay:500,duration:950});
   animate(node,[{opacity:1},{opacity:1,offset:.78},{opacity:0,transform:'translateY(18px) scale(.97)'}],{duration:1500,easing:'linear'});
  }else if(ghost.selected){
   const dx=bounds.left+bounds.width/2-(rect.left+rect.width/2);
   const dy=0;
   animate(node,[{transform:'translate(0,0) scale(1)',opacity:1},{transform:`translate(${dx}px,${dy}px) scale(1.06)`,opacity:1,offset:.6},{transform:`translate(${dx}px,${dy-12}px) scale(1.1)`,opacity:0}],{duration:490,easing:'linear'});
  }else{
   const direction=rect.left+rect.width/2<bounds.left+bounds.width/2?-1:1;
   animate(node,[{transform:'translate(0,0) rotate(0)',opacity:1},{transform:`translate(${direction*(innerWidth+rect.width)}px,35px) rotate(${direction*10}deg)`,opacity:0}],{duration:320});
  }
 }
 if(kind==='folder')animateDossierSequence(ghosts,bounds,layer,animate);
 const destination=scene.firstElementChild;
 if(destination)animate(destination,[{opacity:0,transform:'translateY(14px) scale(.98)'},{opacity:1,transform:'translateY(0) scale(1)'}],{delay:kind==='envelope'?1300:kind==='folder'?2980:240,duration:kind==='envelope'?400:300});
 // allSettled handles cancelled animations without unhandled promise rejections.
 Promise.allSettled(current.animations.map(animation=>animation.finished)).then(()=>{if(motion===current)cancelMotion();});
}
function change(fn){clearTimeout(timer);timer=null;history.push(clone(state));fn();save();render();}
function undo(){cancelMotion();if(!history.length)return;clearTimeout(timer);timer=null;state=history.pop();save();render();}
function log(text){state.log.push(text);}
function exhausted(){state.screen='exhausted';log('X3 — '+GAME_DATA.cards.X3.title);}
function pay(cost){if(state.days<cost){exhausted();return false;}state.days-=cost;return true;}
function applyCard(){const c=GAME_DATA.cards[state.card];for(const [who,n] of Object.entries(c.changes))state[who]=Math.max(1,Math.min(5,state[who]+n));if(c.main)state.done.push(state.decision);state.screen='card';log(state.card+' — '+(c.main?'Decision completed.':'Talks stalled; return to this decision.')+' Days left: '+state.days+'. Stalin: '+state.Stalin+'; Churchill: '+state.Churchill+'.');}
function openCard(){if(motion)return;transitionTo('envelope',document.querySelector('.envelope'),()=>openCardNow());}
function openCardNow(){change(()=>{const c=GAME_DATA.cards[state.card];log('Opened telegram '+state.card+'.');if(!pay(c.cost))return;if(c.roll){state.roll={target:7-state.Stalin,value:null,success:null};state.screen='roll';}else applyCard();});}
function resolveRoll(value){if(state.screen!=='roll'||state.roll.value!==null)return;change(()=>{state.roll.value=value;state.roll.success=value>=state.roll.target;log('Roll: '+value+'; target '+state.roll.target+'+. '+(state.roll.success?'Success.':'Failed — X1: Stalin stalls; one extra day due.'));if(!state.roll.success){if(pay(1))state.screen='stall';}else applyCard();});}
function nextDecision(){if(state.done.length===8){state.screen='ending';return;}if(state.days===0){exhausted();return;}if(state.card && GAME_DATA.cards[state.card].main===false){state.screen='decision';state.card=null;state.roll=null;return;}const remaining=GAME_DATA.issues[state.issue]?.find(id=>!state.done.includes(id));if(remaining){state.decision=remaining;state.screen='decision';}else{state.decision=null;state.issue=null;state.screen='select';}state.card=null;state.roll=null;}
function selectIssue(issue){if(motion)return;const eligible=state.screen==='select'&&state.days>0&&!GAME_DATA.issues[issue].every(id=>state.done.includes(id))&&!(issue==='UN'&&(state.Stalin===1||state.Churchill===1));if(!eligible){selectIssueNow(issue);return;}transitionTo('folder',document.querySelector(`[data-action="issue"][data-value="${issue}"]`),()=>selectIssueNow(issue));}
function selectIssueNow(issue){if(state.screen!=='select'||GAME_DATA.issues[issue].every(id=>state.done.includes(id)))return;change(()=>{if(issue==='UN'&&(state.Stalin===1||state.Churchill===1)){state.screen='locked';log('X2 — UN locked. No days spent.');return;}if(state.days===0){exhausted();return;}state.issue=issue;if(!state.opened.includes(issue))state.opened.push(issue);state.decision=GAME_DATA.issues[issue][0];state.screen='decision';log('Opened issue: '+issue+'.');});}
function choose(cid){if(motion||state.screen!=='decision'||!state.orders[state.decision].includes(cid))return;transitionTo('proposal',document.querySelector(`[data-action="choose"][data-value="${cid}"]`),()=>chooseNow(cid));}
function chooseNow(cid){if(state.screen!=='decision'||!state.orders[state.decision].includes(cid))return;change(()=>{state.card=cid;state.roll=null;state.screen='sealed';log('Choice: '+GAME_DATA.cards[cid].option);});}
function advance(){if(motion)return;if(state.screen==='sealed'){openCard();return;}if(!['title','briefing','stall','card','locked','exhausted','ending','history'].includes(state.screen))return;transitionPage(advanceNow);}
function advanceNow(){switch(state.screen){case'title':change(()=>state.screen='briefing');break;case'briefing':change(()=>state.screen='select');break;case'sealed':openCard();break;case'stall':change(applyCard);break;case'card':change(nextDecision);break;case'locked':change(()=>state.screen='select');break;case'exhausted':change(()=>state.screen='ending');break;case'ending':change(()=>{state.screen='history';state.rows=0;});break;case'history':change(()=>{if(state.rows<4)state.rows++;else state.screen='debrief';});break;}}
function startRoll(){if(timer||state.screen!=='roll')return;const el=document.getElementById('die');el.classList.add('rolling');document.getElementById('roll-button').disabled=true;el.textContent='…';timer=setTimeout(()=>{timer=null;resolveRoll(1+Math.floor(Math.random()*6));},matchMedia('(prefers-reduced-motion: reduce)').matches?0:1000);}
function toast(who){if(state.screen!=='toast'||state.days<1||state[who]>=5)return;change(()=>{state.days--;state[who]++;log('Banquet toast to '+who+': −1 day, '+who+' +1.');state.screen=state.toastReturn;if(state.days===0)exhausted();});}
function act(action,value){if(motion&&action!=='undo')return;if(action==='next')advance();else if(action==='issue')selectIssue(value);else if(action==='choose')choose(value);else if(action==='undo')undo();else if(action==='facilitator'){facilitator=!facilitator;render();}else if(action==='roll')startRoll();else if(action==='physical')resolveRoll(Number(value));else if(action==='toast'){if(['decision','select'].includes(state.screen)&&state.days>0)change(()=>{state.toastReturn=state.screen;state.screen='toast';});}else if(action==='toast-person')toast(value);else if(action==='cancel-toast')change(()=>state.screen=state.toastReturn);else if(action==='restart'){change(()=>{state.restartReturn=state.screen;state.screen='restart';});}else if(action==='cancel-restart')change(()=>state.screen=state.restartReturn);else if(action==='confirm-restart'){change(()=>{state=fresh(state.orders);});}else if(action==='print')window.print();}

function renderHUD(){
 const visible=!['title','briefing'].includes(state.screen);
 const host=document.getElementById('hud');host.hidden=!visible;
 host.innerHTML=`<section class="hud" aria-label="Conference status"><div class="hud-grid"><div class="days"><h3>Days remaining <b>· ${state.days} / 8</b></h3><div class="pips">${Array.from({length:8},(_,i)=>`<span class="pip ${i<8-state.days?'spent':''}" title="Day ${i+1}: ${i<8-state.days?'spent':'remaining'}" aria-label="Day ${i+1}: ${i<8-state.days?'spent':'remaining'}">${i+1}</span>`).join('')}</div></div>${track('Stalin')}${track('Churchill')}</div><div class="hud-foot"><div class="board" aria-label="Issue board">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>`<span>${esc(issue)} ${issue==='UN'&&(state.Stalin===1||state.Churchill===1)?'🔒 ':''}${ids.map((id,i)=>`<span role="img" aria-label="${issue} decision ${i+1}: ${state.done.includes(id)?'complete':'incomplete'}">${state.done.includes(id)?'■':'□'}</span>`).join('')}</span>`).join('')}</div><span class="progress-total">${state.done.length} OF 8 DECISIONS COMPLETE</span></div><div class="toolbar"><button data-action="toast" ${!['select','decision'].includes(state.screen)||state.days===0||(state.Stalin===5&&state.Churchill===5)?'disabled':''}>Banquet toast · 1 day</button><button data-action="undo" ${history.length?'':'disabled'}>Undo</button><button data-action="facilitator" aria-pressed="${facilitator}">Facilitator mode ${facilitator?'on':'off'}</button>${button('Restart','restart')}<label><input type="checkbox" id="physical-toggle" ${physical?'checked':''} ${timer?'disabled':''}> Use physical die</label></div></section>`;
}
function summary(){return `<div class="stats"><div><strong>${state.done.length} / 8</strong>decisions completed</div><div><strong>${state.days}</strong>days left</div><div><strong>${state.Stalin} / 5</strong>Stalin · ${GAME_DATA.labels.track[state.Stalin-1]}</div><div><strong>${state.Churchill} / 5</strong>Churchill · ${GAME_DATA.labels.track[state.Churchill-1]}</div></div><div class="outcome-issues">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>{const count=ids.filter(id=>state.done.includes(id)).length;return `<article class="outcome-issue"><h3>${issue}</h3><small>${count===2?'COMPLETE':state.opened.includes(issue)?'PARTLY NEGOTIATED':'NEVER OPENED'} · ${count} / 2 decisions</small>${count<2?`<p>${issue} · ${ids.filter(id=>!state.done.includes(id)).join(', ')} unresolved</p>`:''}</article>`;}).join('')}</div><details class="record-detail"><summary>View completed decisions</summary>${state.done.length?'<ul>'+state.done.map(id=>'<li>'+esc(id+' · '+GAME_DATA.decisions[id].title)+'</li>').join('')+'</ul>':'<p>None completed.</p>'}</details>`;}
function renderScreen(){
 const c=GAME_DATA.cards[state.card];
 switch(state.screen){
 case'title':return `<section class="hero"><div><div class="eyebrow">Yalta 1945 · The Roosevelt Game</div><h1>Eight days.<br>A world to<br><em>rebuild.</em></h1><p class="intro">${esc(GAME_DATA.subtitle)} Four issues await your decision. The alliance is holding. For now.</p><div class="actions">${next('Enter the briefing room →')}</div><p class="meta">4–5 players · One shared Roosevelt<br>About 30 minutes · Facilitated discussion</p></div>${tableArt()}</section>`;
 case'briefing':return paper('The presidential briefing · 4 February 1945','Eight days. Four issues.',`<p>${esc(GAME_DATA.briefing)}</p><div class="briefing-note"><strong>Your starting position</strong><br>8 days · Stalin 3/5, Wary · Churchill 3/5, Wary<br>Two decisions per issue. Your group speaks as one Roosevelt.</div><ul class="rules brief-rules">${GAME_DATA.rules.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul><p class="discussion-prompt">Before you choose, discuss what you need most—and what you are prepared to concede.</p>${next('Take your seat →')}`);
 case'select':return `<div class="table-heading"><div><div class="eyebrow">The conference table</div><h2>${state.done.length?'What comes next?':'Where do you begin?'}</h2><p>Choose a dossier. Complete both decisions before moving on.</p></div><span class="table-date">${state.days} ${state.days===1?'DAY':'DAYS'} REMAINING</span></div><div class="cards">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>{const complete=ids.every(id=>state.done.includes(id)),locked=issue==='UN'&&(state.Stalin===1||state.Churchill===1),v=ISSUE_VIEW[issue];return `<button class="issue ${complete?'complete':locked?'locked':''}" style="--issue-accent:${v.accent}" data-action="issue" data-value="${issue}" ${complete?'disabled':''}><small>${complete?'SETTLED AT THE TABLE':locked?'LOCKED · REQUIRES BOTH LEADERS AT 2+':'CONFIDENTIAL DOSSIER'}</small><span class="issue-code" aria-hidden="true">${v.code}</span><strong>${issue==='UN'?'United Nations':issue}</strong><span class="issue-subtitle">${v.subtitle}</span><span class="issue-bottom"><small>${ids.filter(id=>state.done.includes(id)).length} of 2 decisions completed</small><span class="issue-arrow" aria-hidden="true">${complete?'✓':locked?'⊘':'↗'}</span></span></button>`;}).join('')}</div><p class="discussion-prompt">Why this issue first? What could settling it give you for the next negotiation?</p>`;
 case'decision':return `<section class="decision-sheet"><div class="decision-meta"><div class="eyebrow">Dossier ${ISSUE_VIEW[state.issue].code} · ${state.issue}</div><span class="caption">DECISION ${state.decision.slice(1)} / 2</span></div><h2>${esc(GAME_DATA.decisions[state.decision].title)}</h2><p>${esc(GAME_DATA.decisions[state.decision].question)}</p><div class="options">${state.orders[state.decision].map((id,i)=>button(`<span class="key" aria-hidden="true">${i+1}</span><span>${esc(GAME_DATA.cards[id].option)}</span><span class="option-arrow" aria-hidden="true">→</span>`,'choose',id,'option')).join('')}</div><p class="discussion-prompt">Agree on a proposal together. Whose cooperation does it require?</p></section>`;
 case'sealed':return paper('Incoming correspondence','A reply has arrived.',`<p class="proposal">${esc(c.option)}</p><button class="envelope" data-action="next"><span class="envelope-letter" aria-hidden="true">TELEGRAM<br>OFFICE OF THE PRESIDENT</span><span class="envelope-pocket" aria-hidden="true"></span><span class="envelope-flap" aria-hidden="true"></span><strong>CONFIDENTIAL · PRESIDENT'S COPY</strong><span class="seal" aria-hidden="true">FDR</span><strong class="open-label">Open telegram →</strong></button><p class="caption" style="font-size:12px;margin:18px 0 0">The proposal’s time cost is charged when you open the telegram.</p>`);
 case'roll':return paper('Negotiation in progress','Will Stalin agree?',`<p>The decision costs ${c.cost} day. That cost has been paid. Roll before applying the agreement’s relationship changes.</p><div class="roll-conditions"><div><small>STALIN BEFORE THE AGREEMENT</small><b>${state.Stalin} / 5 · ${GAME_DATA.labels.track[state.Stalin-1]}</b></div><div><small>RESULT NEEDED</small><b>${state.roll.target}+ <span style="font-size:15px">on a six-sided die</span></b></div></div><p>A failed roll costs one extra day. If you can pay it, Stalin then agrees.</p><div class="dice-row"><div class="die" id="die" role="status" aria-label="Die result" aria-live="polite">?</div><div>${physical?'<p>Enter the physical die result:</p><div class="physical">'+[1,2,3,4,5,6].map(n=>button(n,'physical',n)).join('')+'</div>':'<button class="primary" id="roll-button" data-action="roll">Roll die →</button>'}</div></div>`);
 case'card':return paper('Telegram '+state.card,c.main?'An agreement is reached.':'The talks have stalled.',`<div class="telegram"><p>${esc(c.text)}</p></div>${state.roll?`<p class="result">Die: ${state.roll.value} · Target: ${state.roll.target}+ · ${state.roll.success?'Success':'Failed — X1 cost one extra day; Stalin then agreed'}</p>`:''}<div class="effects"><span>${c.cost===0?'0 days spent':'−1 day'}${state.roll?.success===false?' + 1 extra day for X1':''}</span>${Object.entries(c.changes).map(([w,n])=>'<span>'+w+' '+(n>0?'+':'−')+Math.abs(n)+'</span>').join('')}${!Object.keys(c.changes).length?'<span>No track changes</span>':''}<br><strong>${c.main?'Decision complete.':'Return to the same decision. Track damage remains.'}</strong></div>${(GAME_DATA.reactions[state.card]||[]).map(r=>`<blockquote class="reaction"><strong>${r.who}</strong><p>“${esc(r.text)}”</p><small>${GAME_DATA.labels.drama}</small></blockquote>`).join('')}${next()}`);
 case'stall':return paper('Telegram X1',GAME_DATA.cards.X1.title,`<p>${esc(GAME_DATA.cards.X1.text)}</p><p class="result">Die: ${state.roll.value} · Target: ${state.roll.target}+ · Failed</p><div class="effects">−1 extra day paid. The agreement’s track changes apply next.</div>${next('Apply the agreement →')}`);
 case'locked':return paper('Telegram X2',GAME_DATA.cards.X2.title,`<p>${esc(GAME_DATA.cards.X2.text)}</p><div class="effects">No days spent. No track changes.<br>Stalin ${state.Stalin}/5 · Churchill ${state.Churchill}/5 · Both must be at least 2.</div>${next('Return to the table →')}`);
 case'exhausted':return paper('Telegram X3',GAME_DATA.cards.X3.title,`<p>${esc(GAME_DATA.cards.X3.text)}</p>${state.roll?.value?`<p class="result">Die: ${state.roll.value} · Target: ${state.roll.target}+ · ${state.roll.success?'Success':'Failed — the extra day cannot be paid.'}</p>`:''}${next('View your outcome →')}`);
 case'toast':return paper('Between decisions','Raise a banquet toast.',`<p>Spend one day to raise one relationship by one. This does not complete a decision.</p>${state.days===1?'<p class="status-banner incomplete">This will spend your final day. Roosevelt will leave before you can negotiate again.</p>':''}<div class="actions">${['Stalin','Churchill'].map(w=>`<button data-action="toast-person" data-value="${w}" ${state[w]===5?'disabled':''}>${w} · ${state[w]} → ${Math.min(5,state[w]+1)}<br><small>${state[w]===5?'Already at maximum':'Cost: 1 day'}</small></button>`).join('')}${button('Cancel','cancel-toast')}</div>`);
 case'restart':return paper('A fresh conference','Start again?',`<p>A new game resets days, tracks and the decision log, and shuffles the options. Undo can restore this game.</p><div class="actions">${button('Start new game','confirm-restart','','primary')}${button('Keep playing','cancel-restart')}</div>`);
 case'ending':return paper('Your conference record','Leaving Yalta',`<p class="status-banner ${state.done.length===8?'':'incomplete'}">${state.done.length===8?esc(GAME_DATA.complete):'Your conference has ended. Unresolved issues remain open.'}</p>${summary()}<p class="discussion-prompt">Before revealing history: what did you secure, what did it cost, and what did you leave unresolved?</p>${next('What happened in history →')}`);
 case'history':return paper('The historical record','Agreements and aftermath',`<p>${esc(GAME_DATA.historyIntro)}</p><p class="reveal-progress">${state.rows} OF 4 ISSUES REVEALED</p>${GAME_DATA.history.slice(0,state.rows).map(row=>`<article class="history-row"><h3>${row.issue}</h3><div><small>WHAT ROOSEVELT GOT AT YALTA</small><p>${esc(row.deal)}</p></div><div><small>WHAT HAPPENED NEXT</small><p>${esc(row.after)}</p></div><div class="group-result">Your group: ${GAME_DATA.issues[row.issue].every(id=>state.done.includes(id))?'main line reached':state.opened.includes(row.issue)?'not reached':'never opened'}</div></article>`).join('')}${state.rows===4?'<p style="margin-top:28px">'+esc(GAME_DATA.historyClosing)+'</p>':''}<div class="actions">${next(state.rows<4?'Reveal '+GAME_DATA.history[state.rows].issue+' →':'Begin the debrief →')}</div>`);
 case'debrief':return paper('Around the table','What did your choices cost?',`${Object.entries(GAME_DATA.debrief).map(([heading,questions])=>`<h3 class="debrief-label">${esc(heading)}</h3><ul class="debrief-questions">${questions.map(q=>'<li>'+esc(q)+'</li>').join('')}</ul>`).join('')}<div class="actions">${button('Print group summary','print','','primary')}${button('Play again','restart')}</div><section class="print-summary"><h2>Your group’s conference record</h2>${summary()}<h3>Completed decisions</h3><ul>${state.done.map(id=>'<li>'+esc(id+' · '+GAME_DATA.decisions[id].title)+'</li>').join('')||'<li>None completed.</li>'}</ul><h3>Choices, cards and rolls</h3><ol>${state.log.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol></section>`);
 }
}
function renderFacilitator(){const panel=document.getElementById('facilitator');panel.hidden=!facilitator;panel.className='facilitator';document.getElementById('workspace').classList.toggle('facilitating',facilitator);if(!facilitator){panel.innerHTML='';return;}const key=state.decision||'Issue select';let entries=[];if(GAME_DATA.facilitator[key])entries.push(GAME_DATA.facilitator[key].split(' Also show this hint table:')[0]);if(state.card&&GAME_DATA.cards[state.card]?.main===false&&state.screen==='card')entries.push(GAME_DATA.facilitator['After any dead end']);if(state.roll?.success===false)entries.push(GAME_DATA.facilitator['After a failed roll']);if(state.days<=2)entries.push(GAME_DATA.facilitator['When 2 or fewer days remain']);panel.innerHTML='<h3>Facilitator notes</h3><p class="visibility-note">Visible to everyone viewing this screen. Press F to hide.</p>'+entries.map(t=>'<p>'+esc(t)+'</p>').join('');if(key==='Issue select'){const hints=GAME_DATA.facilitator[key].split('Also show this hint table: ')[1];panel.innerHTML+='<table class="hint-table"><caption>Opening issue hints</caption><tbody>'+hints.split('; ').map(t=>{const [issue,detail]=t.split(' — ');return '<tr><th scope="row">'+esc(issue)+'</th><td>'+esc(detail)+'</td></tr>';}).join('')+'</tbody></table>';}}
function render(){cancelMotion();renderHUD();document.getElementById('screen').innerHTML=renderScreen();renderFacilitator();document.getElementById('log').hidden=!state.log.length;document.getElementById('log-count').textContent=state.log.length;document.getElementById('log-list').innerHTML=state.log.map(t=>'<li>'+esc(t)+'</li>').join('');document.getElementById('screen').focus({preventScroll:true});window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.value);});
document.addEventListener('change',e=>{if(e.target.id==='physical-toggle'){if(motion){e.target.checked=physical;return;}clearTimeout(timer);timer=null;physical=e.target.checked;save();render();}});
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||e.repeat)return;const tag=e.target.tagName;if(['INPUT','TEXTAREA','SELECT'].includes(tag))return;const key=e.key.toLowerCase();if(motion&&key!=='u'){e.preventDefault();return;}if(key==='f'){e.preventDefault();act('facilitator');}else if(key==='u'){e.preventDefault();undo();}else if(['1','2','3'].includes(key)&&state.screen==='decision'){e.preventDefault();choose(state.orders[state.decision][Number(key)-1]);}else if((key==='enter'||key===' ')&&!['BUTTON','SUMMARY'].includes(tag)){e.preventDefault();advance();}});
boot();
</script></body></html>
