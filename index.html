function resolveRoll(value){if(state.screen!=='roll'||state.roll?.value!==null||!Number.isInteger(value)||value<1||value>6)return;change(()=>{state.roll.value=value;state.roll.success=value>=state.roll.target;log('Roll '+value+' against '+state.roll.target+'+: '+(state.roll.success?'success':'complication')+'.');if(state.roll.success)historical();else{state.reason='roll';state.screen='counter';}});}
function roll(){if(timer||state.screen!=='roll')return;document.getElementById('die').classList.add('rolling');document.getElementById('die').textContent='…';document.getElementById('roll-button').disabled=true;timer=setTimeout(()=>resolveRoll(1+Math.floor(Math.random()*6)),matchMedia('(prefers-reduced-motion: reduce)').matches?0:800);}
function resolveCounter(kind){if(state.screen!=='counter')return;change(()=>{const b=GAME_DATA.branches[state.decision],c=GAME_DATA.cards[state.card],failed=state.reason==='roll';if(kind==='walk'){finish({status:'walkaway',title:'No agreement; issue left unresolved',text:'You decline the available terms. Any remaining decision on this issue will stay unattempted.',score:c.score<0?-1:0,why:c.score<0?'The unsupported opening position used time and goodwill without an agreement. Walking away avoids further concessions.':'You avoid a concession you cannot defend, but secure no agreement on this decision.',changes:{},historical:false});return;}if(kind==='press'){const cost=bargainCost();if(!pay(cost))return;log('Further bargaining: '+cost+' additional day(s).');finish({status:'agreement',title:'Negotiated terms',text:b.pressText,score:c.score<0?Math.min(1,b.pressScore):b.pressScore,why:c.score<0?'You recover a workable compromise after an unsupported opening demand, using further bargaining.':'You use bargaining to improve the specificity or balance of the terms. Limits on enforcement and leverage still remain.',changes:b.changes,historical:false});return;}if(kind==='accept'){finish({status:'agreement',title:failed?'Conditional agreement':b.title,text:failed?b.title+'. Support is conditional; the remaining detail is left for further discussion.':b.title+'. You accept the counteroffer as stated.',score:failed?Math.max(-1,c.score-1):b.score,why:failed?'You preserve time by accepting less certain terms after the complication. The concession, not the die result itself, reduces this assessment.':b.why,changes:b.changes,historical:false});}});}
function onward(){if(state.screen!=='result')return;change(()=>{const ids=GAME_DATA.issues[state.issue];if(ids.every(id=>state.results[id]))closeIssue();if(state.closed.length===4){state.screen='ending';return;}if(!state.days){exhausted();return;}if(state.closed.includes(state.issue)){state.issue=null;state.decision=null;state.screen='select';}else{state.decision=ids.find(id=>!state.results[id]);state.screen='decision';}state.card=null;state.roll=null;state.reason=null;});}
function leave(){if(!['select','decision'].includes(state.screen))return;change(()=>{state.returnTo=state.screen;state.screen='leave';});}
function confirmLeave(){if(state.screen!=='leave')return;change(()=>{if(state.returnTo==='select'){state.screen='ending';log('The group closes its conference early.');return;}state.card=null;finish({status:'walkaway',title:'Issue deliberately left unresolved',text:'You preserve time for other priorities. Remaining decisions on this issue stay unattempted.',score:0,why:'You conserve resources without securing an agreement. This is a deliberate deferral, not a completed settlement.',changes:{},historical:false});});}
function toast(who){if(state.screen!=='toast'||state.days<1||!['Stalin','Churchill'].includes(who)||state[who]===5)return;change(()=>{state.days--;state[who]++;log('Toast to '+who+': −1 day, relationship +1.');state.screen=state.returnTo;if(!state.days)exhausted();});}
function next(){switch(state.screen){case'title':change(()=>state.screen='briefing');break;case'briefing':change(()=>state.screen='select');break;case'result':onward();break;case'locked':change(()=>state.screen='select');break;case'exhausted':change(()=>state.screen='ending');break;case'ending':change(()=>{state.rows=0;state.screen='history';});break;case'history':change(()=>{if(state.rows<4)state.rows++;else state.screen='debrief';});break;}}
function act(a,v){if(a==='undo'){undo();return;}if(a==='notes'){facilitator=!facilitator;cancelRoll();render();return;}if(a==='next')next();else if(a==='issue')chooseIssue(v);else if(a==='choose')choose(v);else if(a==='send')send();else if(a==='reconsider'&&state.screen==='reflect')change(()=>{state.card=null;state.screen='decision';});else if(a==='roll')roll();else if(a==='physical')resolveRoll(Number(v));else if(a==='counter')resolveCounter(v);else if(a==='leave')leave();else if(a==='confirm-leave')confirmLeave();else if(a==='cancel'&&['leave','toast','restart'].includes(state.screen))change(()=>state.screen=state.returnTo);else if(a==='toast'&&['select','decision'].includes(state.screen)&&state.days>0)change(()=>{state.returnTo=state.screen;state.screen='toast';});else if(a==='toast-person')toast(v);else if(a==='restart'&&state.screen!=='restart')change(()=>{state.returnTo=state.screen;state.screen='restart';});else if(a==='confirm-restart'&&state.screen==='restart')change(()=>state=fresh(state.orders));else if(a==='print')window.print();}
const button=(text,action,value='',cls='')=>`<button class="${cls}" data-action="${action}" data-value="${esc(value)}">${text}</button>`;
const nextButton=(text='Continue →')=>button(text,'next','','primary');
function paper(label,title,body){return `<section class="paper"><div class="eyebrow">${label}</div><h2>${esc(title)}</h2>${body}</section>`;}
function avatar(who,score=3){const colors={Roosevelt:'#9bbaf2',Stalin:'#a3c9a0',Churchill:'#d5b2ed'},hair=who==='Stalin'?'<path d="M48 56Q40 20 79 18Q115 17 115 55L101 42L58 44Z" fill="#39373b"/>':who==='Churchill'?'<path d="M37 43H123V52H37Z M49 43V16Q80 9 111 16V43Z" fill="#353344" stroke="#211e32" stroke-width="3"/>':'<path d="M44 57Q40 24 76 24Q112 24 116 57L103 43L53 43Z" fill="#aaa7a0"/>';const mouth=score<=2?'<path d="M68 87Q80 78 92 87" fill="none" stroke="#554039" stroke-width="3"/>':'<path d="M67 81Q80 94 93 81" fill="none" stroke="#554039" stroke-width="3"/>';return `<svg viewBox="0 0 160 155" role="img" aria-label="${who}, ${GAME_DATA.labels.track[score-1]}"><path d="M25 155V125Q27 99 61 99H99Q133 99 135 125V155" fill="${colors[who]}" stroke="#26243e" stroke-width="4"/><path d="M59 102L80 129L101 102" fill="#f6eddb" stroke="#26243e" stroke-width="3"/><path d="M75 117H85L90 145H70Z" fill="#4d4a68"/><rect x="43" y="32" width="74" height="71" rx="29" fill="#ecc6a7" stroke="#26243e" stroke-width="4"/>${hair}<path d="M56 59L70 ${score<=2?64:59}M90 ${score<=2?64:59}L104 59" stroke="#4d3935" stroke-width="4" stroke-linecap="round"/><circle cx="65" cy="69" r="3" fill="#302939"/><circle cx="95" cy="69" r="3" fill="#302939"/>${who==='Roosevelt'?'<g stroke="#464557" stroke-width="2" fill="none"><circle cx="65" cy="69" r="10"/><circle cx="95" cy="69" r="10"/><path d="M75 68H85"/></g>':''}${who==='Stalin'?'<path d="M63 80Q72 73 80 78Q88 73 97 80L91 86L80 83L69 86Z" fill="#39373b"/>':mouth}</svg>`;}
function room(interactive=true){return `<section class="room" aria-label="The conference room"><div class="leaders">${['Churchill','Roosevelt','Stalin'].map(w=>`<div class="leader">${avatar(w,w==='Roosevelt'?3:state[w])}<b>${w}</b><small>${w==='Roosevelt'?'YOUR GROUP':GAME_DATA.labels.track[state[w]-1]+' · '+state[w]+'/5'}</small></div>`).join('')}</div><div class="table ${interactive?'':'intro-table'}"><div class="table-caption">FOUR ISSUES. ONE SHARED ROOSEVELT.</div><div class="dossiers">${Object.entries(ISSUE_VIEW).map(([issue,v],i)=>{const settled=state.closed.includes(issue),locked=issue==='UN'&&(state.Stalin===1||state.Churchill===1);return `<button class="dossier" style="--accent:${v.color};--tilt:${i%2?2:-2}deg" data-action="issue" data-value="${issue}" ${settled||!interactive?'disabled':''}><span class="stamp">${settled?'FILE CLOSED':locked?'LOCKED · RELATIONS':'ISSUE '+v.code}</span><span class="object-icon" aria-hidden="true">${v.icon}</span><b>${issue==='UN'?'United Nations':issue}</b>${interactive?`<small>${settled?'Review at the ending':locked?'Both leaders need 2+':'Open discussion →'}</small>`:''}</button>`;}).join('')}</div></div></section>`;}
function hud(){const show=!['title','briefing'].includes(state.screen);document.getElementById('hud').hidden=!show;if(!show)return;document.getElementById('hud').innerHTML=`<section class="hud" aria-label="Conference status"><div class="hud-top"><div class="day-group"><span class="hud-label">Time at the table</span><strong>${state.days} days remaining</strong><div class="days">${Array.from({length:8},(_,i)=>`<span class="day ${i<8-state.days?'spent':''}" aria-label="Day ${i+1}: ${i<8-state.days?'spent':'available'}">${i+1}</span>`).join('')}</div></div>${['Stalin','Churchill'].map(w=>`<div><span class="hud-label">${w}</span><strong>${state[w]} / 5 · ${GAME_DATA.labels.track[state[w]-1]}</strong><div class="track" aria-hidden="true">${[1,2,3,4,5].map(n=>`<span class="${n<=state[w]?'on':''}"></span>`).join('')}</div><span class="tiny">${w==='Stalin'?'Roll '+(7-state[w])+'+ for agreement':'UN needs both leaders at 2+'}</span></div>`).join('')}</div><div class="hud-bottom"><div class="board">${Object.entries(GAME_DATA.issues).map(([issue,ids])=>`<span>${issue} ${ids.map(id=>`<span aria-label="${id}: ${state.results[id]?.status||'unresolved'}">${state.results[id]?.status==='agreement'?'●':state.results[id]?'×':'○'}</span>`).join('')}</span>`).join('')}</div><div class="toolbar"><button data-action="toast" ${!['select','decision'].includes(state.screen)||!state.days||(state.Stalin===5&&state.Churchill===5)?'disabled':''}>Toast · 1 day</button><button data-action="undo" ${history.length?'':'disabled'}>Undo</button><button data-action="notes" aria-pressed="${facilitator}">Facilitator ${facilitator?'on':'off'}</button>${button('Restart','restart')}<label><input type="checkbox" id="physical-toggle" ${physical?'checked':''} ${timer?'disabled':''}> Physical die</label></div></div></section>`;}
function scoreSummary(){const values=Object.values(state.results),total=values.reduce((n,r)=>n+r.score,0),agreements=values.filter(r=>r.status==='agreement').length;return `<div class="score-grid"><div class="score-box"><strong>${total>0?'+':''}${total}</strong><span>DECISION POINTS</span></div><div class="score-box"><strong>${agreements}/8</strong><span>AGREEMENTS</span></div><div class="score-box"><strong>${8-agreements}</strong><span>UNRESOLVED DECISIONS</span></div><div class="score-box"><strong>${state.days}</strong><span>DAYS LEFT</span></div></div><p class="tiny">Stalin ${state.Stalin}/5 · Churchill ${state.Churchill}/5. Scores are teaching judgments, not historical grades. Read the explanations alongside the total. Unattempted decisions add no points.</p>`;}
function outcomes(){return Object.entries(GAME_DATA.decisions).map(([id,d])=>{const r=state.results[id];return `<article class="outcome"><h3><span>${id} · ${esc(d.title)}</span>${r?`<span class="score ${r.score<0?'negative':''}">${r.score>0?'+':''}${r.score}</span>`:''}</h3>${r?`<p><b>${r.status==='agreement'?'Agreement':'Unresolved · deliberate walkaway'}:</b> ${esc(r.title)}</p><p><b>Your proposal:</b> ${esc(r.proposal)}</p><p>${esc(r.text)}</p><p><b>Why this score:</b> ${esc(r.why)}</p>`:'<p>Unresolved · no settled decision. No points added.</p>'}</article>`;}).join('');}
function screen(){const c=GAME_DATA.cards[state.card],d=GAME_DATA.decisions[state.decision],b=GAME_DATA.branches[state.decision];switch(state.screen){
case'title':return `<section class="hero"><div><span class="pill">A DISCUSSION GAME · ABOUT 30 MINUTES</span><h1>Big decisions.<br><em>Eight days.</em></h1><p class="lead">You’re Roosevelt. Your group calls the shots. What will you give up to get an agreement?</p><p class="tiny">${esc(GAME_DATA.subtitle)}</p><div class="actions">${nextButton('Take your seat →')}</div>${storageNotice?'<p class="notice" style="margin-top:20px;color:var(--ink)">'+esc(storageNotice)+'</p>':''}</div>${room(false)}</section>`;
case'briefing':return paper('Before the meeting','One president. Your choices.',`<p>${esc(GAME_DATA.briefing)}</p><ul class="rules">${GAME_DATA.rules.map(t=>'<li>'+esc(t)+'</li>').join('')}</ul><h3>What the hidden scores mean</h3><p class="tiny">Each settled decision earns −1, 0, +1 or +2. The assessment considers your goals, leverage, safeguards and concessions. Relationships are separate; pleasing a leader does not automatically earn points.</p><details><summary>Read the scoring rubric</summary><ul>${Object.entries(GAME_DATA.rubric).map(([n,t])=>'<li><b>'+n+'</b> · '+t+'</li>').join('')}</ul></details><p class="notice">${GAME_DATA.simulationNotice} The historical record is shown separately after play.</p><div class="actions">${nextButton('Open the conference →')}</div>`);
case'select':return `<div class="eyebrow">The conference table</div><h2>${state.opened.length?'What comes next?':'Where do you begin?'}</h2>${room()}<p class="table-prompt">Which issue matters most—and whose cooperation will you need?</p><div class="actions">${button('Close conference early','leave','','quiet')}</div>`;
case'decision':return paper(state.issue+' · Decision '+state.decision.slice(1)+' of 2',d.title,`<p>${esc(d.question)}</p><div class="options">${state.orders[state.decision].map((id,i)=>button(`<span class="key">${i+1}</span><span>${esc(GAME_DATA.cards[id].option)}</span><span class="arrow" aria-hidden="true">→</span>`,'choose',id,'option')).join('')}</div><p class="tiny" style="margin-top:20px">Select a proposal to discuss it. You commit only when you send.</p><div class="actions">${button('Leave this issue unresolved','leave','','quiet')}</div>`);
case'reflect':return paper('Pause before you send','Talk it through.',`<div class="proposal">${esc(c.option)}</div><div class="prompts">${c.questions.map((q,i)=>`<div class="prompt"><b>${i+1}</b><p>${esc(q)}</p></div>`).join('')}</div><p class="notice">Discuss aloud. Sending spends ${c.cost} ${c.cost===1?'day':'days'}. No timer, no written answer required.</p><div class="actions">${button('Send proposal →','send','','primary')}${button('Reconsider','reconsider','','quiet')}</div>`);
case'roll':return paper('Stalin is considering your proposal','Will he agree?',`<div class="question-header"><div class="mini-avatar">${avatar('Stalin',state.Stalin)}</div><p>The proposal’s day has been paid. You need <b>${state.roll.target}+</b>, based on Stalin’s current relationship. Track changes come after the result.</p></div><p class="notice">A failed roll creates a counteroffer. You choose whether to spend time, accept modified terms or walk away.</p><div class="die-row"><div id="die" class="die" role="status" aria-live="polite">?</div>${physical?'<div class="physical">'+[1,2,3,4,5,6].map(n=>button(n,'physical',n)).join('')+'</div>':'<button id="roll-button" class="primary" data-action="roll">Roll die →</button>'}</div>`);
case'counter':{const cost=bargainCost();return paper('Simulation · '+(state.reason==='roll'?'A complication':'A counteroffer'),'The terms have changed.',`<div class="question-header"><div class="mini-avatar">${avatar(b.who,state[b.who])}</div><div><h3>${b.who}</h3><p class="tiny">Dramatised line, not a historical quote.</p></div></div><div class="bubble"><p>${esc(b.text)}</p></div>${state.roll?`<p class="notice">Roll ${state.roll.value} · Target ${state.roll.target}+. No extra day has been charged. The original proposal’s day is already spent.</p>`:`<p class="notice">Your proposal has been heard. ${effectsText(c.changes)}. Its day is already spent.</p>`}<div class="counter-options">${button((state.reason==='roll'?'Accept conditional support':esc(b.label))+'<small>No extra day. '+(state.reason==='roll'?'Leave remaining detail open.':esc(b.title))+'. '+effectsText(b.changes)+'.</small>','counter','accept','primary')}<button data-action="counter" data-value="press" ${state.days<cost?'disabled':''}>${esc(b.press)}<small>${cost?'Spend 1 extra day.':'No extra day: '+b.who+' is warm enough to continue readily.'} ${esc(b.pressText)} ${effectsText(b.changes)}.</small></button>${button('Walk away from this issue<small>No extra day or relationship change. Remaining decisions on this issue stay unresolved.</small>','counter','walk','quiet')}</div>`);}
case'result':{const r=state.results[state.decision];return paper(r.historical?'Historical agreement · '+state.card:'Simulation outcome · '+state.decision,r.title,`<p>${esc(r.text)}</p><div class="effect"><span>${state.days} days remaining</span><span>${effectsText(r.changes||{})}</span><span>${r.status==='agreement'?'Agreement recorded':'Issue left unresolved'}</span></div>${r.historical?(GAME_DATA.reactions[state.card]||[]).map(x=>`<div class="bubble"><b>${x.who}</b><p>${esc(x.text)}</p><small class="tiny">${GAME_DATA.labels.drama}</small></div>`).join(''):'<p class="notice" style="margin-top:20px">'+GAME_DATA.simulationNotice+'</p>'}<p class="tiny" style="margin-top:20px">Your decision is recorded. Its score and explanation will be revealed at the ending.</p><div class="actions">${nextButton()}</div>`);}
case'locked':return paper('UN · Relationships need repair','The room is too divided.',`<p>${esc(GAME_DATA.cards.X2.text)}</p><p class="notice">Stalin ${state.Stalin}/5 · Churchill ${state.Churchill}/5. Both need at least 2. No days spent.</p><div class="actions">${nextButton('Return to the table →')}</div>`);
case'toast':return paper('Make room for cooperation','Raise a toast.',`<p>One day raises one relationship by one. It does not settle a decision.</p>${state.days===1?'<p class="notice">This spends your last day. Your conference will end immediately.</p>':''}<div class="actions">${['Stalin','Churchill'].map(w=>`<button data-action="toast-person" data-value="${w}" ${state[w]===5?'disabled':''}>${w}: ${state[w]} → ${Math.min(5,state[w]+1)}</button>`).join('')}${button('Cancel','cancel','','quiet')}</div>`);
case'leave':return paper('A deliberate choice',state.returnTo==='select'?'Close the conference?':'Leave this issue unresolved?',`<p>${state.returnTo==='select'?'Your ending will reveal the decisions made so far. Unattempted decisions remain unresolved.':'You will move on to other priorities. This decision records a walkaway, and any remaining decision on this issue stays unattempted. You cannot reopen a closed issue.'}</p><p class="notice">No day or relationship cost.</p><div class="actions">${button('Confirm →','confirm-leave','','primary')}${button('Keep negotiating','cancel','','quiet')}</div>`);
case'restart':return paper('Fresh start','Start a new conference?',`<p>Reset this redesign’s progress and reshuffle the proposals. Your original-version save stays separate. Undo can restore this conference.</p><div class="actions">${button('Start new game','confirm-restart','','primary')}${button('Keep playing','cancel','','quiet')}</div>`);
case'exhausted':return paper('Time is up','Roosevelt leaves Yalta.',`<p>${esc(GAME_DATA.cards.X3.text)}</p><div class="actions">${nextButton('Reveal your outcome →')}</div>`);
case'ending':return paper('The full picture','What did your choices cost?',`${scoreSummary()}<p>${Object.values(state.results).filter(r=>r.status==='agreement').length===8?'You reached an agreement on every decision. Read the trade-offs before judging your result.':'Your conference contains unresolved decisions. Review what you secured and what you left open.'}</p>${outcomes()}<div class="actions">${nextButton('Compare with history →')}${button('Print this record','print','','quiet')}</div>`);
case'history':return paper('Historical record · not the simulated branches','What happened after Yalta?',`<p>${esc(GAME_DATA.historyIntro)}</p><p class="tiny">${state.rows} of 4 issues revealed</p>${GAME_DATA.history.slice(0,state.rows).map(r=>`<article class="history-row"><h3>${r.issue}</h3><div class="history-columns"><div><small>WHAT ROOSEVELT GOT</small><p>${esc(r.deal)}</p></div><div><small>WHAT HAPPENED NEXT</small><p>${esc(r.after)}</p></div></div><p class="notice">Your group: ${GAME_DATA.issues[r.issue].filter(id=>state.results[id]?.status==='agreement').length}/2 agreements · ${state.opened.includes(r.issue)?'issue opened':'never opened'}. Simulated agreements may differ from the historical settlement.</p></article>`).join('')}${state.rows===4?'<p style="margin-top:24px">'+esc(GAME_DATA.historyClosing)+'</p>':''}<div class="actions">${nextButton(state.rows<4?'Reveal '+GAME_DATA.history[state.rows].issue+' →':'Discuss your conference →')}</div>`);
case'debrief':return paper('Back to your group','Defend your decisions.',`<p>Which score would you challenge? Use your goals and the situation to explain why. The rubric starts a discussion; it does not settle it.</p>${Object.entries(GAME_DATA.debrief).map(([h,qs])=>'<h3>'+esc(h)+'</h3><ul>'+qs.map(q=>'<li>'+esc(q)+'</li>').join('')+'</ul>').join('')}<div class="actions">${button('Print group summary','print','','primary')}${button('Play again','restart','','quiet')}</div><section class="print-only"><h2>Your conference record</h2>${scoreSummary()}${outcomes()}<h3>Choice and roll log</h3><ol>${state.log.map(t=>'<li>'+esc(t)+'</li>').join('')}</ol></section>`);
}}
function render(){hud();document.getElementById('screen').innerHTML=screen();const notes=document.getElementById('notes');notes.hidden=!facilitator;document.getElementById('layout').classList.toggle('notes-on',facilitator);if(facilitator){const key=state.decision||'Issue select';notes.innerHTML='<h3>Facilitator notes</h3><p class="tiny">Visible to everyone looking at this screen. F hides notes.</p><p>'+esc(GAME_DATA.facilitator[key]||'Discuss your priorities and compare the group’s reasoning with its outcomes.')+'</p><p>Do not reveal point values during play. Invite a reason for each proposal and discuss who bears its costs.</p>'+(state.days<=2?'<p>What are you leaving unresolved, and who will pay for it later?</p>':'');}else notes.innerHTML='';document.getElementById('log').hidden=!state.log.length;document.getElementById('log-count').textContent=state.log.length;document.getElementById('log-list').innerHTML=state.log.map(t=>'<li>'+esc(t)+'</li>').join('');document.getElementById('screen').focus({preventScroll:true});window.scrollTo(0,0);}
document.addEventListener('click',e=>{const b=e.target.closest('button[data-action]');if(b&&!b.disabled)act(b.dataset.action,b.dataset.value);});
document.addEventListener('change',e=>{if(e.target.id==='physical-toggle'){cancelRoll();physical=e.target.checked;save();render();}});
document.addEventListener('keydown',e=>{if(e.repeat||e.ctrlKey||e.metaKey||e.altKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName))return;const k=e.key.toLowerCase();if(k==='u'){e.preventDefault();undo();}else if(k==='f'){e.preventDefault();act('notes');}else if(['1','2','3'].includes(k)&&state.screen==='decision'){e.preventDefault();choose(state.orders[state.decision][Number(k)-1]);}else if((k==='enter'||k===' ')&&!['BUTTON','SUMMARY'].includes(e.target.tagName)){e.preventDefault();next();}});
boot();
</script></body></html>
